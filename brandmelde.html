  if(e.target.dataset && e.target.dataset.uhr){ const v = parseInt(e.target.value,10) || 0; upd("anlagen", ui.anlage, {uhrOffset: v}).then(()=>render()); return; }
  if(e.target.id==="planFile"){ const fs = [...e.target.files]; e.target.value=""; if(fs.length && S.kunden[ui.kunde]) uploadPlans(fs, ui.kunde); return; }
  if(e.target.id==="importFile"){ const file = e.target.files[0]; e.target.value=""; if(file) importBackup(file); return; }
  if(e.target.dataset && e.target.dataset.move && e.target.value){
    upd("anlagen", e.target.dataset.move, {kundeId: e.target.value}).then(()=>toast("Anlage zugeordnet."));
    return;
  }
  const k=e.target.dataset && e.target.dataset.k; if(!k) return;
  ui.f[k]= e.target.type==="checkbox" ? e.target.checked : e.target.value;
  if(e.target.id==="fa-kunde" && !ui.f.ort && !document.querySelector("form[data-f=anlage][data-id]")){
    const kd = S.kunden[e.target.value]; const o = document.getElementById("fa-ort");
    if(o && !o.value && kd) o.value = [kd.strasse, kd.ort].filter(Boolean).join(", ");
  }
});
document.addEventListener("submit", async e=>{
  e.preventDefault();
  const form = e.target, kind = form.dataset.f, f = ui.f;
  const val = id => ((document.getElementById(id)||{}).value || "").trim();
  if(kind==="kunde"){
    const data = {nr: val("fk-nr"), name: val("fk-name"), ansprech: val("fk-ansprech"), strasse: val("fk-strasse"),
      plz: val("fk-plz"), ort: val("fk-ort"), tel: val("fk-tel"), mail: val("fk-mail"), notiz: val("fk-notiz")};
    if(!data.name) return;
    const id = form.dataset.id;
    if(data.nr && list("kunden").some(k=>k.nr===data.nr && k.id!==id)){ toast(`Kunden-Nr. ${data.nr} ist schon vergeben.`); return; }
    ui.form=null; ui.f={};
    if(id){ await upd("kunden", id, data); toast("Gespeichert."); render(); }
    else { data.created = new Date().toISOString(); const nid = await add("kunden", data); if(nid){ ui.q=""; go("kunde", nid); } }
  } else if(kind==="anlage"){
    const name = val("fa-name"); if(!name) return;
    const data = {name, ort: val("fa-ort"), bmz: val("fa-bmz"), akkuDatum: val("fa-akd"), akkuJahre: val("fa-akj"), akkuTyp: val("fa-akt"), akkuAnz: val("fa-akn")};
    const sel = document.getElementById("fa-kunde");
    const id = form.dataset.id;
    if(sel) data.kundeId = sel.value;
    else if(!id) data.kundeId = S.kunden[ui.kunde] ? ui.kunde : "";
    ui.form=null; ui.f={};
    if(id){ await upd("anlagen", id, data); render(); }
    else { data.created = new Date().toISOString(); const nid = await add("anlagen", data); if(nid) go("anlage", nid); }
  } else if(kind==="gruppe"){
    const nr = parseInt(val("fg-nr"),10); if(!(nr>0)) return;
    if(gruppen(ui.anlage).some(g=>g.nr===nr)){ toast(`Gruppe ${pad(nr)} gibt es schon in dieser Anlage.`); return; }
    const gname = val("fg-name");
    ui.form=null; ui.f={}; render();
    await add("gruppen", {anlageId: ui.anlage, nr, name: gname});
  } else if(kind==="melder"){
    const gid = form.dataset.g, start = parseInt(val("fm-nr"),10), n = Math.min(99, parseInt(val("fm-n"),10)||1);
    if(!(start>0)) return;
    const taken = new Set(melder(gid).map(m=>m.nr));
    const nums = Array.from({length:n},(_,i)=>start+i);
    const dup = nums.filter(x=>taken.has(x));
    if(dup.length){ toast(`Melder ${dup.join(", ")} gibt es in dieser Gruppe schon.`); return; }
    const art = val("fm-art")||"O", ort = val("fm-ort");
    ui.f = {mart: art, mn: f.mn}; // Art und Anzahl für den nächsten Block merken
    ui.form = null; render();
    const an = S.anlagen[ui.anlage], extra = {};
    for(const nr of nums){
      const doc = {anlageId: ui.anlage, gruppeId: gid, nr, art, ort, status:"", am:null, von:""};
      if(an && an.qplan){ doc.q = qRegel(nr); if(an.qplan.teiljahr && (an.qplan.jahr||curY())===curY() && doc.q < curQ()) doc.q = curQ(); }
      await add("melder", doc);
    }
  } else if(kind==="vren"){
    const name = val("pv-name"), id = PV.id;
    PV.rename = false;
    if(name && S.plaene[id] && name!==S.plaene[id].name){ await upd("plaene", id, {name}); toast("Grundriss umbenannt."); }
    drawPlan(); render(); return;
  } else if(kind==="akkutausch"){
    const a = S.anlagen[ui.anlage]; if(!a) return;
    const datum = val("at-datum") || todayISO(), notiz = val("at-notiz");
    ui.confirm = null;
    await upd("anlagen", ui.anlage, {akkuDatum: datum,
      akkuHist: [...(a.akkuHist||[]), a.akkuDatum].filter(Boolean),
      akkuLog: [...(a.akkuLog||[]), {am:datum, typ:a.akkuTyp||"", anz:a.akkuAnz||"", von:pruefName(), notiz, vorher:a.akkuDatum||""}]});
    render(); toast("Akkutausch gespeichert."); return;
  } else if(kind==="calc"){
    const a = S.anlagen[ui.anlage]; if(!a) return;
    const v = calcWerte(a);
    const calc = {ah: val("c-ah") || (v.ah!=null ? String(v.ah) : ""), iq: val("c-iq"), ia: val("c-ia"), tq: String(v.tq), ta: val("c-ta"), zus: val("c-zus")};
    ui.form = null; ui.f = {};
    await upd("anlagen", ui.anlage, {calc}); render();
    const res = ueberbrueckung(calcWerte({...a, calc}, false));
    toast(res && res.tq!=null ? `Gespeichert: Überbrückung ${res.tq<0?"reicht nicht":zahl(res.tq,0)+" h"}${res.ok?" ✓":" – zu kurz"}` : "Gespeichert.");
  } else if(kind==="punkt"){
    const name = val("fp-name"); if(!name) return;
    const nr = punkteVon(ui.anlage).reduce((x,p)=>Math.max(x,p.nr||0),0)+1, bereich = val("fp-ber")||"normal";
    ui.form = null; ui.f = {}; render();
    await add("messpunkte", {anlageId:ui.anlage, name, bereich, nr});
  } else if(kind==="mess"){
    const p = S.messpunkte[form.dataset.p]; if(!p) return;
    const pegel = parseDb(val("fs-pegel")), umgebung = parseDb(val("fs-umg"));
    if(pegel==null){ toast("Bitte den gemessenen Alarmpegel eintragen."); return; }
    const bw = schallBewertung(pegel, umgebung, p.bereich), notiz = val("fs-notiz"), pid = form.dataset.p;
    ui.form = null; ui.f = {}; render();
    await add("messungen", {anlageId:ui.anlage, punktId:pid, punktName:p.name, bereich:p.bereich||"normal", pegel, umgebung, notiz, am:new Date().toISOString(), von:pruefName()});
    toast(bw.st==="ok" ? `${dbFmt(pegel)} dB(A) gespeichert – ok.` : `${dbFmt(pegel)} dB(A) gespeichert – ${bw.txt}.`);
  } else if(kind==="einst"){
    const data = {firma: val("fe-firma"), pruefer: val("fe-pruefer"), art: val("fe-art")||"O", knrStart: val("fe-knr"), akkuJahre: val("fe-akj"), akkuWarn: val("fe-akw"),
      sMin: val("fe-smin"), sSchlaf: val("fe-sschlaf"), sAbstand: val("fe-sabst"), sMax: val("fe-smax")};
    ui.f = {};
    await saveEinst(data);
  }
});

render();
initBlobs().then(render);
window.addEventListener("pageshow",()=>{try{design=localStorage.getItem("app.design")||"modern";theme=localStorage.getItem("app.mode")||"system"}catch(e){} applyDesign(); applyTheme(); render();});

(async()=>{
  return; // nur Gerätespeicher
  claude.use("downloads").then(x=>{ dl = x; if(ui.view==="einst") render(); });
  claude.use("assets").then(x=>{ assetsApi = x; if(ui.view==="kunde") render(); });
  const d = await window.claude.use("db");
  if(!d){ loading = false; render(); return; }
  db = d; live = true;
  for(const c of COLS) S[c] = {};
  S.einst = {};
  const loaded = new Set(), need = COLS.length + 1;
  const done = () => { if(loading && loaded.size===need){ loading = false; setTimeout(jahreswechselPruefen, 500); } if(!loading) render(); };
  const onErr = err => { console.error(err); loading = false; render(); toast("Verbindung zum Speicher unterbrochen. Seite neu laden."); };
  for(const c of COLS){
    db.collection(c).onSnapshot(snap=>{
      S[c] = Object.fromEntries(snap.docs.map(x=>[x.id, x.data()]));
      loaded.add(c); done();
    }, onErr);
  }
  db.doc("einstellungen/app").onSnapshot(snap=>{
    S.einst = snap.exists ? {...snap.data()} : {};
    loaded.add("einst"); done();
  }, onErr);
})();
</script>
