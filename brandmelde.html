<title>Brandmeldeanlagen – Oh-MyGosch</title>
<style>
/* (alt) one column like a Prüfprotokoll on a clipboard — pick a Kunde in the Kunden tab; the Anlagen tab then lists only that customer's Anlagen. Red panel headers, fixed bottom bar. */
/* Layout: iOS-like single column — large titles on a soft ground, borderless cards, fixed translucent bottom bar (Kunden / Anlagen / Einstellungen). */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --sunk:#edf1f6; --ink:#141a26; --muted:#667085; --line:#e5e8ee;
  --accent:#0b4f96; --accent-ink:#ffffff; --accent-soft:#e5edf6; --brand:#003769; --danger:#d03b2f; --danger-soft:#fdeceb;
  --ok:#16875a; --ok-soft:#e4f4ec; --warn:#b4610a; --warn-soft:#fcf0e1;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05);
  --f-display:system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:system-ui,-apple-system,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --surface:#181c23; --sunk:#20252e; --ink:#e9edf3; --muted:#98a2b3; --line:#2a303a;
  --accent:#7fb0ec; --accent-ink:#06152a; --accent-soft:#15263d; --brand:#e9edf3; --danger:#ff6b5e; --danger-soft:#3a1916;
  --ok:#45c482; --ok-soft:#13291f; --warn:#f2aa45; --warn-soft:#2d2210; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#181c23; --sunk:#20252e; --ink:#e9edf3; --muted:#98a2b3; --line:#2a303a;
  --accent:#7fb0ec; --accent-ink:#06152a; --accent-soft:#15263d; --brand:#e9edf3; --danger:#ff6b5e; --danger-soft:#3a1916;
  --ok:#45c482; --ok-soft:#13291f; --warn:#f2aa45; --warn-soft:#2d2210; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);padding-inline:16px;padding-block:16px calc(150px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.strip{background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:12px;padding:10px 14px}
.strip h1{margin:0;flex:1;min-width:0;font:700 1.35rem/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.strip small{font:600 .72rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.back{border:0;background:none;color:var(--accent-ink);font:600 .85rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:4px 0;opacity:.9;display:flex;align-items:center;gap:4px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{padding:12px 14px;display:grid;gap:4px;border-bottom:1px solid var(--line)}
.sub .kn{font:700 .8rem/1 var(--f-mono);color:var(--muted)}
.sub .nm{font:700 1.45rem/1.15 var(--f-display);overflow-wrap:anywhere;text-wrap:balance}
.leds{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.led{background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.led span{font:600 .7rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.led span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.led.on-ok span::before{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.led.on-warn span::before{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.led.on-open span::before{background:var(--accent)}
.led b{font:700 1.4rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk)}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:5px 9px;font-size:.82rem}
.search{flex:1 1 200px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* Kundenliste & Anlagenliste */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px;text-align:left}
.item:first-child{border-top:0}

.it{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.pills{flex:none;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.go{width:9px;height:9px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);flex:none}
.mini{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:4px;max-width:220px}
.mini i{display:block;height:100%;background:var(--ok)}

/* Stammdaten */
.stamm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.stamm h2,.sec{margin:0;font:600 .78rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
dl.kv{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}
dl.kv dt{font:600 .72rem/1.9 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;user-select:text}
dl.kv dd a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px}
.notiz{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.95rem}

/* Meldergruppen */
section.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ghead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left}
.gnr{font:700 1rem/1 var(--f-mono);background:var(--ink);color:var(--surface);border-radius:6px;padding:6px 7px;min-width:2.6em;text-align:center}
.gname{flex:1;min-width:0;font:600 1.15rem/1.2 var(--f-display);letter-spacing:.02em;overflow-wrap:anywhere}
.gcount{font:500 .85rem/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.gcount.done{color:var(--ok)}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-4px;transition:transform .2s;flex:none}
.grp.closed .chev{transform:rotate(-45deg);margin-top:0}
.gbar{height:3px;background:var(--sunk)}.gbar i{display:block;height:100%;background:var(--ok)}
ul.mel{list-style:none;margin:0;padding:0}
li.m{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-top:1px solid var(--line)}
li.m.ok{background:var(--ok-soft)}
li.m.mangel{background:var(--warn-soft)}
.chk{flex:none;width:44px;height:44px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.chk svg{width:22px;height:22px;opacity:0}
li.ok .chk{background:var(--ok);border-color:var(--ok)}
li.ok .chk svg{opacity:1;stroke:var(--surface)}
li.mangel .chk{border-color:var(--warn)}
.mid{font:700 .95rem/1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.art{font:600 .72rem/1 var(--f-display);letter-spacing:.08em;border:1px solid var(--line);border-radius:4px;padding:3px 5px;color:var(--muted);white-space:nowrap}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.info .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ort{font-size:.92rem;color:var(--muted);overflow-wrap:anywhere}
.stamp{font:500 .72rem/1 var(--f-mono);color:var(--ok)}
li.mangel .stamp{color:var(--warn)}
.mbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font:600 .75rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
li.mangel .mbtn{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.del{flex:none;border:0;background:none;color:var(--danger);font-weight:700;padding:6px 8px}
.gfoot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);background:var(--sunk)}

form.card{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.gfoot form.card{border:0;padding:0;background:none;width:100%}

.row{display:flex;gap:8px;flex-wrap:wrap}

.row label.narrow{flex:0 1 96px}
.row input,.row select,.row textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font:500 1rem/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink);width:100%;min-width:0}
.row textarea{min-height:70px;resize:vertical}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px}
.empty h2{margin:0;font:700 1.5rem/1.1 var(--f-display);text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:.92rem}

.toast{position:fixed;z-index:40;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px)}
/* Untere Leiste */
nav.tabs{position:fixed;z-index:5;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;color:var(--muted);font:600 .74rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;position:relative}

.kpill{font:600 .72rem/1 var(--f-display);letter-spacing:.04em;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.stamm .row label{flex-basis:180px}
.item.sel{background:var(--ok-soft)}

.btn.big{padding:14px 16px;font-size:1rem;text-align:left}

.viewer[hidden]{display:none}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.vt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.vt small{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt b{font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn{flex:none;border:0;background:var(--sunk);color:var(--ink);border-radius:99px;min-width:40px;height:40px;padding:0 10px;font:700 1.1rem/1 var(--f-body)}
.vchips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.vchips button{flex:none;border:0;border-radius:99px;padding:7px 12px;background:var(--sunk);color:var(--ink);font:600 .85rem/1 var(--f-body)}
.vchips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.vp{flex:1;position:relative;overflow:hidden;touch-action:none;background:var(--sunk);cursor:grab}
.vp img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.vload{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600}
.vren{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
.vren input{flex:1;min-width:0;border:1px solid var(--accent);border-radius:10px;background:var(--sunk);color:var(--ink);padding:9px 10px;font:500 1rem/1.2 var(--f-body)}
.vfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-start;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);font-size:.92rem}
/* Akku */
svg.bat{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.akku{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.akku .it{flex:1 1 180px}
.akku .it b{font:700 1.02rem/1.25 var(--f-body)}
.aic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.aic svg.bat{width:24px;height:24px}
.akku.none .aic{background:var(--sunk);color:var(--muted)}
.akku.soon{background:var(--warn-soft)} .akku.soon .aic{background:var(--warn);color:var(--surface)} .akku.soon .it b{color:var(--warn)}
.akku.over{background:var(--danger-soft)} .akku.over .aic{background:var(--danger);color:var(--surface);animation:pulse 1.6s ease-in-out infinite} .akku.over .it b{color:var(--danger)}
.akku.soon .btn.primary{background:var(--warn);color:var(--surface)}
.akku.over .btn.primary{background:var(--danger);color:var(--surface)}
.aconf{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.92rem}
@keyframes pulse{50%{transform:scale(1.08)}}
.achip{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;margin-top:4px;border-radius:99px;padding:4px 9px 4px 7px;font:650 .8rem/1.1 var(--f-body)!important;white-space:normal}
.achip svg.bat{width:15px;height:15px}
.achip.soon{background:var(--warn-soft);color:var(--warn)!important}
.achip.over{background:var(--danger-soft);color:var(--danger)!important}
.alarm{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.alarm-h{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:.95rem}
.alarm-h span{margin-left:auto;font-weight:600;opacity:.85}
.alarm.soon .alarm-h{background:var(--warn);color:var(--surface)}
.alarm.over .alarm-h{background:var(--danger);color:var(--surface)}
.arow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 16px;text-align:left;color:var(--ink)}
.alarm-h + .arow{border-top:0}
.apack{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font:600 .85rem/1.2 var(--f-body)!important;color:var(--ink)!important}
.apack svg.bat{width:16px;height:16px}
.apack strong{font-weight:800}
.apack.miss{color:var(--danger)!important}
.akku .apack{background:var(--surface);border-radius:8px;padding:6px 10px;align-self:flex-start}
.apacklist{padding:12px 16px;border-top:1px solid var(--line);background:var(--sunk);font-size:.92rem}
.apacklist span{color:var(--muted)}
.adue{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font:700 .9rem/1 var(--f-body)}
.adue small{font:500 .75rem/1 var(--f-body);color:var(--muted)}
.adue.soon{color:var(--warn)} .adue.over{color:var(--danger)}
nav.tabs button{position:relative}
.tbadge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--warn);color:var(--surface);font:700 .7rem/18px var(--f-body);text-align:center}
.tbadge[hidden]{display:none}
.tbadge.over{background:var(--danger)}
@media (prefers-reduced-motion: reduce){.akku.over .aic{animation:none}}
/* Logo */
.brand{display:flex;align-items:center;justify-content:center;gap:12px;padding:2px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.brand img{display:block;height:auto;width:min(100%,340px)}
.strip h1.small{font-size:1.3rem;letter-spacing:-.01em}
.brand span{margin-left:auto;font:600 .78rem/1.2 var(--f-body);color:var(--muted);text-align:right}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand img{filter:brightness(0) invert(.93)}}
:root[data-theme="dark"] .brand img{filter:brightness(0) invert(.93)}
/* Abgleich-Liste */
.plist .prow{grid-template-columns:4.9em 1fr auto}
.ptime{display:flex;flex-direction:column;gap:3px}
.ptime small{font:500 .7rem/1 var(--f-body);color:var(--muted)}
.nfl .prow{grid-template-columns:4.9em 1fr}
.nfl .prow .pact{grid-column:1/-1;justify-content:flex-start}
.pact{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.pbtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font:800 1.05rem/1 var(--f-body);display:grid;place-items:center;cursor:pointer}
.pbtn.ok{color:var(--ok);border-color:var(--ok)}
.pbtn.nf{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 55%, transparent)}
.pbtn.ok:active{background:var(--ok);color:var(--surface)}
.pbtn.nf:active{background:var(--danger);color:#fff}
.pnum{font-size:1.15rem;color:var(--ink)}
.pnfc{color:var(--danger);font-weight:700}
.nfl{box-shadow:0 0 0 2px var(--danger-soft), var(--shadow)}
.nfl .pday{background:var(--danger-soft);color:var(--danger)}
.pdone{display:flex;flex-direction:column;gap:6px;background:var(--ok-soft);color:var(--ok);border-radius:var(--r);padding:16px;font:800 1.15rem/1.2 var(--f-body)}
.pdone small{font:500 .86rem/1.35 var(--f-body);color:var(--muted)}
.parch{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.parch > summary{list-style:none;cursor:pointer;padding:13px 16px;font:650 .9rem/1 var(--f-body);color:var(--muted)}
.parch > summary::-webkit-details-marker{display:none}
.parch > summary::after{content:" ▾"}
.parch[open] > summary::after{content:" ▴"}
.ptag{border-top:1px solid var(--line)}
.ptag-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 16px;text-align:left;color:var(--ink)}
.ptag-h > span:not(.chev){color:var(--muted);font-size:.86rem;flex:1}
.ptag-h em{font-style:normal;color:var(--danger);font-weight:700}
.ptag .plist{box-shadow:none;border-radius:0;background:var(--sunk)}
.preset{display:flex;justify-content:center;padding-top:4px}
.pdelday{padding:8px 16px 12px;display:flex;justify-content:flex-end;background:var(--sunk)}
.pres.ok{background:var(--ok-soft);color:var(--ok)}
/* Untermenü der Prüfung */
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:-4px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:1 1 auto;border:0;background:none;color:var(--muted);font:650 .82rem/1 var(--f-body);padding:10px 4px 11px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
:root[data-design="neon"] .subtabs button[aria-selected="true"]{color:var(--neon-cyan);border-bottom-color:var(--neon-cyan);text-shadow:0 0 10px rgba(53,200,255,.45)}
/* Kundenliste: Zeile wählt aus, Pfeil öffnet den Kundenstamm */
.krow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.krow:first-child{border-top:0}
.krow .item{flex:1;min-width:0;border-top:0}
.krow.sel{background:var(--accent-soft)}
.krow.sel .knr{background:var(--accent);color:var(--accent-ink)}
.kradio{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.krow.sel .kradio{border-color:var(--accent);background:radial-gradient(circle, var(--accent) 0 5px, transparent 6px)}
.kopen{flex:none;width:52px;border:0;border-left:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer}
.kopen:active{background:var(--sunk)}
.kopen .go{width:11px;height:11px;border-color:var(--accent);border-width:2.5px}
:root[data-design="neon"] .krow.sel{background:linear-gradient(90deg, rgba(59,140,255,.16), transparent)}
:root[data-design="neon"] .krow.sel .knr{background:linear-gradient(100deg, var(--neon-blue), var(--neon-cyan));color:#fff}
:root[data-design="neon"] .krow.sel .kradio{border-color:var(--neon-cyan);background:radial-gradient(circle, var(--neon-cyan) 0 5px, transparent 6px);box-shadow:0 0 10px rgba(53,200,255,.5)}
:root[data-design="neon"] .kopen .go{border-color:var(--neon-cyan)}
/* Warn-Kacheln oben in der Kundenliste */
.alerts{display:grid;gap:10px}
.alerts.two{grid-template-columns:1fr 1fr}
.atile{border:0;border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:5px;text-align:left;color:#fff;min-width:0;box-shadow:var(--shadow)}
.atile.soon{background:var(--warn)}
.atile.over{background:var(--danger)}
.atile.mg{background:var(--warn-soft);color:var(--warn)}
.at-h{display:flex;align-items:center;gap:7px;font-size:.98rem}
.at-h .chev{margin-left:auto;border-color:currentColor;transform:rotate(45deg);margin-top:-4px}
.atile.open .at-h .chev{transform:rotate(-135deg);margin-top:4px}
.at-ic{font-size:1rem;line-height:1}
.at-n{font:800 1.1rem/1.15 var(--f-body)}
.at-s{font:600 .78rem/1.25 var(--f-body);opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alarm.mgl .mtxtk{color:var(--warn);font-weight:600;font-size:.86rem}
.adue.mg{color:var(--muted);font-size:.8rem}
:root[data-design="neon"] .atile.over{background:linear-gradient(120deg, var(--neon-red), var(--neon-mag));box-shadow:0 0 20px rgba(255,46,77,.3)}
:root[data-design="neon"] .atile.soon{background:linear-gradient(120deg, #ff8a2e, #ff3d7a)}
:root[data-design="neon"] .atile.mg{background:rgba(255,154,60,.14);color:#ffb26b;box-shadow:0 0 0 1px rgba(255,154,60,.25)}
@media (max-width:360px){.alerts.two{grid-template-columns:1fr}}
/* Hinweise beim Kunden */
.hinweise{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.hinweise h2{margin:0;padding:12px 16px 6px;font:650 .85rem/1 var(--f-body);color:var(--muted)}
.hrow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 16px;text-align:left;color:var(--ink)}
.hinweise h2 + .hrow{border-top:0}
.hic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem}
.hic svg.bat{width:20px;height:20px}
.hrow.over .hic{background:var(--danger);color:#fff}
.hrow.soon .hic{background:var(--warn);color:#fff}
.hrow.mg .hic{background:var(--warn-soft);color:var(--warn)}
.hrow.over .it span{color:var(--danger)}
.hrow.soon .it span{color:var(--warn)}
.achip.mgc{background:var(--warn-soft);color:var(--warn)!important}
/* Mängel */
.mcount{display:inline-block;min-width:18px;height:18px;border-radius:99px;background:var(--danger);color:#fff;font:700 .7rem/18px var(--f-body);text-align:center;padding:0 5px}
li.mnote{display:grid;gap:8px;padding:12px 16px 14px;background:var(--warn-soft);border-top:1px solid var(--line)}
li.mnote label{font:650 .85rem/1.2 var(--f-body);color:var(--warn)}
li.mnote textarea, .mcard textarea, .merl textarea{width:100%;border:1px solid transparent;border-radius:12px;background:var(--surface);color:var(--ink);padding:10px 12px;font:500 1rem/1.35 var(--f-body);resize:vertical}
li.mnote textarea:focus, .mcard textarea:focus{border-color:var(--accent);outline:none}
.mnbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mtext{display:block;margin-top:4px;border:0;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:5px 8px;text-align:left;font:600 .84rem/1.3 var(--f-body);overflow-wrap:anywhere}
.mlist{display:grid;gap:10px}
.mcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:8px;border-left:4px solid var(--warn)}
.mcard.done{border-left-color:var(--ok);opacity:.92}
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mort{color:var(--muted);font-size:.9rem}
.mtxt{margin:0;font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.mtxt.leer{color:var(--muted);font-weight:500;font-style:italic}
.mmeta{margin:0;font-size:.8rem;color:var(--muted)}
.mfix{margin:0;font-size:.88rem;color:var(--ok);font-weight:600}
.merl{display:grid;gap:8px;background:var(--sunk);border-radius:12px;padding:12px}
.merl label{font:600 .84rem/1.2 var(--f-body);color:var(--muted)}
.mchk{display:flex;align-items:center;gap:8px;color:var(--ink)!important}
.mchk input{width:20px;height:20px;accent-color:var(--ok)}
.pfix{color:var(--ok)}
/* Akku-Rechner */
.calc .tools h3{margin:0}
.cseg{align-items:center;gap:10px}
.cseg > span{font:500 .84rem/1 var(--f-body);color:var(--muted)}
#cerg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cres{display:flex;flex-direction:column;gap:4px;border-radius:12px;padding:12px 14px;background:var(--sunk)}
.cres span{font-size:.8rem;color:var(--muted);font-weight:600}
.cres b{font:800 1.5rem/1.1 var(--f-body)}
.cres small{font-size:.82rem;font-weight:600;color:var(--muted)}
.cres.ok{background:var(--ok-soft)} .cres.ok b,.cres.ok small{color:var(--ok)}
.cres.bad{background:var(--danger-soft)} .cres.bad b,.cres.bad small{color:var(--danger)}
section.card.kap{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:12px}
.kap h3{margin:0;font:700 1.15rem/1.2 var(--f-display);letter-spacing:-.01em}
#kerg{display:grid;gap:8px}
.kbar{position:relative;height:10px;border-radius:99px;background:var(--line);overflow:visible}
.kbar i{display:block;height:100%;border-radius:99px}
.kbar i.ok{background:var(--ok)} .kbar i.bad{background:var(--danger)}
.kbar span{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5}
.kform b{color:var(--ink)}
.akkubtn{width:100%;border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.akkubtn .chev{margin-left:auto;flex:none;border-color:currentColor;opacity:.7}
.akkubtn .chev.up{transform:rotate(-135deg);margin-top:4px}
button.akkuline{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);color:var(--muted)}
button.akkuline.ok svg.bat{color:var(--ok)}
button.akku{display:flex;align-items:center;gap:12px}
.akkumenu{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:12px;margin-top:-6px}
.akkumenu .kv dd .miss{color:var(--danger)}
.ak-ok{color:var(--ok)} .ak-soon{color:var(--warn)} .ak-over{color:var(--danger)}
.atbtn{justify-self:start}
.atausch{display:grid;gap:10px;background:var(--sunk);border-radius:12px;padding:12px}
.atausch .row input{background:var(--surface)}
.averlauf{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.averlauf > b{font:650 .85rem/1 var(--f-body);color:var(--muted)}
.avz{display:grid;grid-template-columns:6.2em 1fr;gap:8px;font-size:.92rem}
.avz > span:first-child{font-weight:700;font-variant-numeric:tabular-nums}
.avz small{display:block;color:var(--muted);font-size:.8rem}
.akhint{margin:-4px 0 0;font-size:.85rem;color:var(--muted)}
.akhint b{color:var(--ink)} .akhint b.bad{color:var(--danger)} .akhint b.soon{color:var(--warn)} .akhint b.ok{color:var(--ok)}
.kform{margin:0;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.crw{grid-column:1/-1;display:grid;gap:4px;background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.9rem}
.crw > b{font:700 .86rem/1 var(--f-body);color:var(--muted);margin-bottom:4px}
.crr{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.crr span:last-child{font-weight:700;white-space:nowrap}
.crr.sum{border-top:1px solid var(--line);padding-top:4px}
.crr.tot{border-top:2px solid var(--line);padding-top:5px;font-weight:800;font-size:1rem}
.crr.okr span{color:var(--ok)} .crr.badr span{color:var(--danger)}
.cok{color:var(--ok);font-weight:700} .cbad{color:var(--danger);font-weight:700}
/* Schallpegel */
.slim{margin:0;font-size:.8rem;color:var(--muted)}
.spunkt{border-top:1px solid var(--line)}
.spunkt:first-child{border-top:0}
.sp-h{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.sp-h .it{flex:1 1 150px}
.sval{flex:none;display:flex;align-items:baseline;gap:3px;font:800 1.15rem/1 var(--f-body);border-radius:10px;padding:7px 9px;background:var(--sunk);color:var(--ink)}
.sval small{font:600 .68rem/1 var(--f-body);opacity:.8}
.sval.ok{background:var(--ok-soft);color:var(--ok)}
.sval.bad{background:var(--danger-soft);color:var(--danger)}
.spunkt form.card{box-shadow:none;border-radius:0;background:var(--sunk);padding:14px 16px}
.spunkt form.card .row input{background:var(--surface)}
.sbew{border-radius:10px;padding:10px 12px;font-weight:700;background:var(--surface);color:var(--muted)}
.sbew.ok{background:var(--ok-soft);color:var(--ok)}
.sbew.bad{background:var(--danger-soft);color:var(--danger)}
.srow{display:grid;grid-template-columns:3.4em 1fr auto auto;gap:10px;align-items:center;padding:10px 12px 10px 14px;border-top:1px solid var(--line)}
.sdel{display:flex;gap:6px}
.pday{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pdx{border:0;background:none;color:var(--muted);font:600 .76rem/1 var(--f-body);padding:4px 0}
.pdc{display:flex;align-items:center;gap:6px;color:var(--danger)}
/* Protokoll */
.pkopf{gap:12px}
.ptage{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ptage button{flex:none;border:0;border-radius:10px;background:var(--sunk);color:var(--ink);padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 .88rem/1 var(--f-body)}
.ptage button small{font:600 .72rem/1 var(--f-body);color:var(--muted)}
.ptage button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ptage button[aria-pressed="true"] small{color:var(--accent-ink)}
.ptsel{border:0;border-radius:10px;background:var(--sunk);color:var(--ink);padding:0 10px;font:600 .85rem/1 var(--f-body)}
.psum{font-size:.95rem}
.pabg{display:grid;gap:6px;font-size:.84rem;color:var(--muted)}
.popts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.poff{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.poff input{width:70px;border:1px solid transparent;border-radius:10px;background:var(--sunk);padding:7px 8px;font:600 .9rem/1 var(--f-body);color:var(--ink)}
.plist{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.prow{display:grid;grid-template-columns:5.6em 1fr auto 44px;gap:10px;align-items:center;padding:9px 12px 9px 14px;border-top:1px solid var(--line)}
.pday{padding:8px 14px;background:var(--accent-soft);color:var(--accent);font:700 .82rem/1 var(--f-body);border-top:1px solid var(--line)}
.prow.phead{border-top:0;background:var(--sunk);font:650 .76rem/1 var(--f-body);color:var(--muted);padding-block:8px}
.prow.abg{background:var(--ok-soft)}
.ptime{font:700 .95rem/1 var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.pm{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
.pm b{font-weight:700}
.pm i{font-style:normal;font-size:.75rem;color:var(--muted);background:var(--sunk);border-radius:5px;padding:2px 5px}
.pm small{flex-basis:100%;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.pm .psam{color:var(--warn)}
.pres{font:700 .8rem/1 var(--f-body);border-radius:99px;padding:5px 8px;background:var(--ok-soft);color:var(--ok)}
.pres.mangel{background:var(--warn-soft);color:var(--warn)}
.pchk{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.pchk svg{width:18px;height:18px;opacity:0;stroke:var(--surface)}
.pchk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.pchk[aria-pressed="true"] svg{opacity:1}
/* Aufgeräumt */
.prog{display:grid;gap:8px;padding:2px 2px 0}
.prog-t{display:flex;align-items:baseline;gap:4px;font-size:.95rem;color:var(--muted)}
.prog-t b{color:var(--ink);font-size:1.05rem}
.prog-t .mgc{margin-left:auto;color:var(--warn);font-weight:700}
.akkuline{display:flex;align-items:center;gap:8px;padding:2px 2px;color:var(--muted);font-size:.88rem}
.akkuline span{flex:1;min-width:0}
.akkuline svg.bat{color:var(--ok)}
.alarm-h{width:100%;border:0;text-align:left;cursor:pointer}
.alarm-h .chev{margin-left:auto;border-color:currentColor;transform:rotate(-45deg);margin-top:0}
.alarm.open .alarm-h .chev{transform:rotate(45deg);margin-top:-4px}
.alarm:not(.open) .apacklist{border-top:0}
/* Prüfung: Quartal / Alle */
.pmode{display:grid;gap:10px}
.pmode.none{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.pmseg{display:grid;grid-template-columns:1fr 1fr}
.pmseg button{padding:9px 10px;font-weight:650}
.pqpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pqpick button{border:2px solid transparent;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font:800 1rem/1 var(--f-body);color:var(--ink)}
.pqpick button small{font:600 .74rem/1 var(--f-body);color:var(--muted)}
.pqpick button.cur{border-color:var(--accent)}
.pqpick button.late{background:var(--danger-soft)} .pqpick button.late small{color:var(--danger)}
.pqpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pqpick button[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.qfbar.warn{background:var(--danger-soft);color:var(--danger)}
/* Quartalsplan */
.atabs{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:12px}
.atabs::-webkit-scrollbar{display:none}
.atabs button{flex:1 0 auto;padding:10px 10px;font:650 .84rem/1 var(--f-body);white-space:nowrap;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.atabs .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);display:inline-block}
.qsech{display:flex;align-items:center;gap:12px;padding:12px 16px}
.qbig{font:800 .95rem/1 var(--f-body);background:var(--sunk);color:var(--muted);border-radius:10px;padding:8px 9px}
.qbig.cur{background:var(--accent);color:var(--accent-ink)}
li.m.pl{padding:10px 16px}
.pst{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.pst.ok{background:var(--ok);border-color:var(--ok)}
.pst.mangel{background:var(--warn);border-color:var(--warn)}
.pst.late{border-color:var(--danger)}
.stamp.late{color:var(--danger)}
li.m.pl .qb{font-size:.82rem;padding:7px 9px}
.qplan{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:12px}
.qplan.intro{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qplan.intro .it{flex:1 1 220px}
.qplan.intro .it b{font:700 1.02rem/1.25 var(--f-body)}
.qhead{display:flex;align-items:baseline;gap:8px}
.qhead b{font:700 1.02rem/1.2 var(--f-body)}
.qhead span{margin-left:auto;color:var(--muted);font-size:.88rem;font-weight:600}
.qbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.qtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qt{border:2px solid transparent;background:var(--sunk);border-radius:12px;padding:9px 8px;display:flex;flex-direction:column;gap:3px;text-align:left;color:var(--ink);min-width:0}
.qt .ql{font:700 .78rem/1 var(--f-body);color:var(--muted);white-space:nowrap}
.qt b{font:750 1.15rem/1 var(--f-body)}
.qt .qs{font:600 .74rem/1.15 var(--f-body);color:var(--muted)}
.qt .qm{font:500 .7rem/1 var(--f-body);color:var(--muted)}
.qt.cur{border-color:var(--accent);background:var(--accent-soft)}
.qt.cur .ql{color:var(--accent)}
.qt.done{background:var(--ok-soft)} .qt.done .qs{color:var(--ok)}
.qt.late{background:var(--danger-soft)} .qt.late .qs,.qt.late .ql{color:var(--danger)}
.qt.vor{opacity:.6}
.qt.sel{box-shadow:0 0 0 2px var(--ink) inset}
.qnow{border-radius:12px;width:100%}
.btn.warnbtn{background:var(--danger);color:var(--surface)}
.qok{margin:0;color:var(--ok);font-weight:700}
.qreset{justify-self:start}
.qnorm{margin:0;font-size:.78rem;color:var(--muted)}
.qfbar{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:8px 8px 8px 14px;font-weight:650;font-size:.9rem}
.qb{font:700 .72rem/1 var(--f-body);border:0;border-radius:6px;padding:4px 6px;background:var(--sunk);color:var(--muted)}
button.qb{cursor:pointer}
.qb.open{box-shadow:0 0 0 2px var(--accent) inset}
.qmoved{color:var(--warn);font-weight:600}
li.qed{display:grid;gap:10px;padding:12px 16px 14px;background:var(--accent-soft);border-top:1px solid var(--line)}
.qedrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qedrow > span{font:600 .86rem/1.2 var(--f-body);min-width:9.5em}
.qbtns{display:flex;gap:6px}
.qbtn{border:0;border-radius:10px;min-width:46px;height:38px;background:var(--surface);color:var(--ink);font:700 .9rem/1 var(--f-body)}
.qbtn.on{background:var(--accent);color:var(--accent-ink)}
.qswap{flex:1 1 180px;min-width:0;border:0;border-radius:10px;padding:9px 10px;background:var(--surface);color:var(--ink);font:500 .92rem/1.2 var(--f-body)}
li.qed .hint{font-size:.8rem}
li.qed > .btn{justify-self:start}
.qb.cur{background:var(--accent-soft);color:var(--accent)}
.qb.late{background:var(--danger-soft);color:var(--danger)}
.achip.qcur{background:var(--accent-soft);color:var(--accent)!important}
.achip.qok{background:var(--ok-soft);color:var(--ok)!important}
@media (max-width:380px){.qtiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){ .pills{display:none} dl.kv{grid-template-columns:1fr;gap:0} dl.kv dd{margin-bottom:8px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ================= Neon-Design (Farben aus dem Kopfbild) ================= */
:root[data-design="neon"]{
  --bg:#06070d; --surface:#0f1220; --sunk:#171b2d; --ink:#eef1ff; --muted:#8e95ba; --line:#242a45;
  --accent:#3b8cff; --accent-ink:#ffffff; --accent-soft:rgba(59,140,255,.16); --brand:#eef1ff;
  --danger:#ff3d5a; --danger-soft:rgba(255,61,90,.16);
  --ok:#2fe6a7; --ok-soft:rgba(47,230,167,.13); --warn:#ff9a3c; --warn-soft:rgba(255,154,60,.15);
  --shadow:0 0 0 1px rgba(110,130,255,.10), 0 10px 28px rgba(0,0,0,.45);
  --neon-red:#ff2e4d; --neon-mag:#e1309a; --neon-blue:#2f7bff; --neon-cyan:#35c8ff;
  color-scheme:dark;
}
:root[data-design="neon"] body{
  background:
    radial-gradient(60% 40% at 0% 0%, rgba(255,46,77,.16), transparent 70%),
    radial-gradient(60% 40% at 100% 10%, rgba(47,123,255,.18), transparent 70%),
    var(--bg);
  background-attachment:fixed;
}
/* Kopfbild */
.banner{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(47,123,255,.22), 0 0 0 1px rgba(110,130,255,.12)}
.banner img{display:block;width:100%;height:auto;aspect-ratio:1200/450;object-fit:cover}
.banner-t{position:absolute;left:16px;bottom:12px;display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.banner-t b{font:800 1.35rem/1.1 var(--f-display);letter-spacing:-.02em;color:#fff}
.banner-t span{font:600 .74rem/1 var(--f-body);color:rgba(255,255,255,.75);letter-spacing:.04em}
/* Akzente */
:root[data-design="neon"] .btn.primary, :root[data-design="neon"] .fab{
  background:linear-gradient(100deg, var(--neon-blue), var(--neon-cyan)); color:#fff;
  box-shadow:0 0 18px rgba(53,200,255,.35);
}
:root[data-design="neon"] .btn{background:var(--sunk);color:#b9c6ff}
:root[data-design="neon"] .btn.ghost{background:none;color:var(--muted)}
:root[data-design="neon"] .btn.danger{background:none;color:var(--danger)}
:root[data-design="neon"] .btn.warnbtn{background:linear-gradient(100deg, var(--neon-red), var(--neon-mag));color:#fff;box-shadow:0 0 18px rgba(255,46,77,.35)}
:root[data-design="neon"] .seg{background:var(--sunk)}
:root[data-design="neon"] .seg button{color:var(--muted)}
:root[data-design="neon"] .seg button[aria-pressed="true"]{background:linear-gradient(100deg, rgba(47,123,255,.9), rgba(53,200,255,.9));color:#fff;box-shadow:0 0 14px rgba(53,200,255,.35)}
:root[data-design="neon"] .strip h1, :root[data-design="neon"] .sub .nm{
  background:linear-gradient(95deg, #fff 30%, #9fc4ff);-webkit-background-clip:text;background-clip:text;color:transparent;
}
:root[data-design="neon"] .back{color:var(--neon-cyan)}
:root[data-design="neon"] .bar i, :root[data-design="neon"] .qbar i, :root[data-design="neon"] .mini i, :root[data-design="neon"] .gbar i{
  background:linear-gradient(90deg, var(--neon-blue), var(--ok));box-shadow:0 0 10px rgba(47,230,167,.5)
}
:root[data-design="neon"] li.ok .chk{background:var(--ok);border-color:var(--ok);box-shadow:0 0 14px rgba(47,230,167,.55)}
:root[data-design="neon"] li.ok .chk svg{stroke:#03130d}
:root[data-design="neon"] li.m.ok{background:linear-gradient(90deg, rgba(47,230,167,.12), transparent)}
:root[data-design="neon"] li.m.mangel{background:linear-gradient(90deg, rgba(255,154,60,.14), transparent)}
:root[data-design="neon"] .chk{background:var(--sunk);border-color:#2e3558}
:root[data-design="neon"] .gnr, :root[data-design="neon"] .knr{background:rgba(59,140,255,.18);color:#9fc4ff}
:root[data-design="neon"] .item.sel{background:linear-gradient(90deg, rgba(59,140,255,.16), transparent)}
:root[data-design="neon"] .item.sel .knr{background:linear-gradient(100deg, var(--neon-blue), var(--neon-cyan));color:#fff}
:root[data-design="neon"] .alarm.over .alarm-h{background:linear-gradient(100deg, var(--neon-red), var(--neon-mag));color:#fff}
:root[data-design="neon"] .alarm.soon .alarm-h{background:linear-gradient(100deg, #ff7a2e, #ff3d7a);color:#fff}
:root[data-design="neon"] .akku.over .aic{background:var(--danger);box-shadow:0 0 18px rgba(255,61,90,.6)}
:root[data-design="neon"] .akku.soon .aic{background:var(--warn);box-shadow:0 0 16px rgba(255,154,60,.5)}
:root[data-design="neon"] .akku.soon .btn.primary{background:linear-gradient(100deg,#ff9a3c,#ff5a7a);box-shadow:none}
:root[data-design="neon"] .akku.over .btn.primary{background:linear-gradient(100deg, var(--neon-red), var(--neon-mag));box-shadow:none}
:root[data-design="neon"] .qt.cur, :root[data-design="neon"] .pqpick button.cur{border-color:var(--neon-cyan);box-shadow:0 0 14px rgba(53,200,255,.25)}
:root[data-design="neon"] .pqpick button[aria-pressed="true"], :root[data-design="neon"] .qbig.cur, :root[data-design="neon"] .ptage button[aria-pressed="true"], :root[data-design="neon"] .qbtn.on, :root[data-design="neon"] .vchips button[aria-pressed="true"]{
  background:linear-gradient(100deg, var(--neon-blue), var(--neon-cyan));color:#fff;border-color:transparent
}
:root[data-design="neon"] .pchk[aria-pressed="true"]{box-shadow:0 0 12px rgba(47,230,167,.5)}
:root[data-design="neon"] .sval.ok{text-shadow:0 0 12px rgba(47,230,167,.45)}
:root[data-design="neon"] .pday{background:rgba(59,140,255,.12);color:#9fc4ff}
:root[data-design="neon"] nav.tabs{background:rgba(10,12,22,.78);border-top-color:#1d2340}
:root[data-design="neon"] nav.tabs button[aria-current="page"]{color:var(--neon-cyan);text-shadow:0 0 10px rgba(53,200,255,.6)}
:root[data-design="neon"] nav.tabs button[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(53,200,255,.7))}
:root[data-design="neon"] .tbadge{background:var(--warn);color:#1a0d00}
:root[data-design="neon"] .tbadge.over{background:var(--danger);color:#fff;box-shadow:0 0 10px rgba(255,61,90,.7)}
:root[data-design="neon"] .row input, :root[data-design="neon"] .row select, :root[data-design="neon"] .row textarea, :root[data-design="neon"] .search{background:var(--sunk);color:var(--ink)}
:root[data-design="neon"] .row input:focus, :root[data-design="neon"] .row select:focus, :root[data-design="neon"] .row textarea:focus{border-color:var(--neon-cyan);background:#141a2e;box-shadow:0 0 0 3px rgba(53,200,255,.15)}
:root[data-design="neon"] .toast{background:#e9eeff;color:#0a0d1a}
:root[data-design="neon"] .atabs .dot{box-shadow:0 0 8px var(--danger)}
@media (prefers-reduced-motion: reduce){ :root[data-design="neon"] *{transition:none!important} }

/* ================= Gosch-Design (Farben und Formen aus dem Firmenlogo) ================= */
:root[data-design="gosch"]{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eef2f6; --ink:#0d1b2e; --muted:#5d6b7c; --line:#d6dee8;
  --accent:#003769; --accent-ink:#ffffff; --accent-soft:#e2eaf3; --brand:#003769;
  --danger:#c62f2f; --danger-soft:#fbe9e9; --ok:#13804f; --ok-soft:#e3f3ea; --warn:#b05f0b; --warn-soft:#fcefdf;
  --shadow:0 1px 0 rgba(0,55,105,.06);
  --f-display:system-ui,-apple-system,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root[data-design="gosch"]:not([data-theme="light"]){
  --bg:#08131f; --surface:#0f1e30; --sunk:#16283d; --ink:#e8eef5; --muted:#93a3b6; --line:#22374f;
  --accent:#7fb2e6; --accent-ink:#04121f; --accent-soft:#16304c; --brand:#e8eef5;
  --danger:#ff6b5e; --danger-soft:#3a1916; --ok:#45c482; --ok-soft:#13291f; --warn:#f2aa45; --warn-soft:#2d2210;
  --shadow:none; color-scheme:dark } }
:root[data-design="gosch"][data-theme="dark"]{
  --bg:#08131f; --surface:#0f1e30; --sunk:#16283d; --ink:#e8eef5; --muted:#93a3b6; --line:#22374f;
  --accent:#7fb2e6; --accent-ink:#04121f; --accent-soft:#16304c; --brand:#e8eef5;
  --danger:#ff6b5e; --danger-soft:#3a1916; --ok:#45c482; --ok-soft:#13291f; --warn:#f2aa45; --warn-soft:#2d2210;
  --shadow:none; color-scheme:dark }
/* Logo */
.brand{display:flex;justify-content:center;padding:6px 0 14px;border-bottom:2px solid var(--accent);margin-bottom:2px}
.brand img{display:block;width:min(100%,320px);height:auto}
@media (prefers-color-scheme: dark){ :root[data-design="gosch"]:not([data-theme="light"]) .brand img{filter:brightness(0) invert(.92)} }
:root[data-design="gosch"][data-theme="dark"] .brand img{filter:brightness(0) invert(.92)}
/* Überschriften kräftig wie der Schriftzug */
:root[data-design="gosch"] .strip h1, :root[data-design="gosch"] .sub .nm{font-family:var(--f-display);font-weight:800;color:var(--brand);letter-spacing:-.01em}
:root[data-design="gosch"] .back{color:var(--accent)}
/* Flächen: klare Kanten, feine Rahmen statt Schatten – wie die Kästchen im Logo */
:root[data-design="gosch"] .list, :root[data-design="gosch"] section.grp, :root[data-design="gosch"] .stamm, :root[data-design="gosch"] .empty,
:root[data-design="gosch"] form.card, :root[data-design="gosch"] .qplan, :root[data-design="gosch"] .plist, :root[data-design="gosch"] .hinweise,
:root[data-design="gosch"] .akkumenu, :root[data-design="gosch"] .mcard, :root[data-design="gosch"] .led, :root[data-design="gosch"] .parch,
:root[data-design="gosch"] section.card.kap, :root[data-design="gosch"] .search, :root[data-design="gosch"] button.akkuline{border:1px solid var(--line);box-shadow:none}
:root[data-design="gosch"] .knr, :root[data-design="gosch"] .gnr{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);border-radius:4px}
:root[data-design="gosch"] .krow.sel .knr, :root[data-design="gosch"] .item.sel .knr{background:var(--accent);color:var(--accent-ink)}
:root[data-design="gosch"] .krow.sel{background:var(--accent-soft)}
:root[data-design="gosch"] .krow.sel .kradio{border-color:var(--accent);background:radial-gradient(circle, var(--accent) 0 5px, transparent 6px)}
:root[data-design="gosch"] .btn{border-radius:6px}
:root[data-design="gosch"] .btn.primary, :root[data-design="gosch"] .fab{background:var(--accent);color:var(--accent-ink);border-radius:6px}
:root[data-design="gosch"] .fab{border-radius:8px;box-shadow:0 4px 14px rgba(0,55,105,.3)}
:root[data-design="gosch"] .seg{background:var(--sunk);border:1px solid var(--line);border-radius:7px}
:root[data-design="gosch"] .seg button{border-radius:5px}
:root[data-design="gosch"] .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
:root[data-design="gosch"] .subtabs button[aria-selected="true"]{color:var(--accent);border-bottom:3px solid var(--accent)}
:root[data-design="gosch"] .chk{border-radius:6px}
:root[data-design="gosch"] .pqpick button, :root[data-design="gosch"] .qt{border-radius:6px;box-shadow:none;border:1.5px solid var(--line)}
:root[data-design="gosch"] .pqpick button.cur, :root[data-design="gosch"] .qt.cur{border-color:var(--accent)}
:root[data-design="gosch"] .pqpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:root[data-design="gosch"] .bar i, :root[data-design="gosch"] .qbar i, :root[data-design="gosch"] .mini i, :root[data-design="gosch"] .gbar i{background:var(--accent)}
:root[data-design="gosch"] li.ok .chk{background:var(--ok);border-color:var(--ok)}
:root[data-design="gosch"] .atile{border-radius:8px}
:root[data-design="gosch"] .akku, :root[data-design="gosch"] .alarm{border-radius:8px}
:root[data-design="gosch"] nav.tabs{background:var(--surface);border-top:2px solid var(--accent);-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-design="gosch"] nav.tabs button[aria-current="page"]{color:var(--accent)}
:root[data-design="gosch"] nav.tabs button[aria-current="page"]::before{display:block;content:"";position:absolute;top:-2px;left:22%;right:22%;height:4px;background:var(--accent);border-radius:0 0 3px 3px}
:root[data-design="gosch"] .toast{background:var(--accent);color:#fff;border-radius:6px}
.akkubtn span.go{flex:none;margin-left:auto;margin-right:4px;border-color:currentColor;opacity:.7}

/* ===== Design „Modern“: hellgrau, weiße Karten mit großen Rundungen, Pillen-Knöpfe in Fast-Schwarz ===== */
:root[data-design="modern"]{--bg:#f3f5f8;--paper:#ffffff;--surface:#ffffff;--sunk:#eef2f6;--ink:#0d1b2e;--muted:#5d6b7c;--line:#d6dee8;--accent:#003769;--accent-ink:#ffffff;--accent-soft:#e2eaf3;--brand:#003769;--ok:#13804f;--ok-soft:#e3f3ea;--danger:#c62f2f;--danger-soft:#fbe9e9;--warn:#b05f0b;--warn-soft:#fcf0e1;--shadow:0 1px 2px rgba(0,55,105,.05),0 12px 32px rgba(0,55,105,.08);--navbg:#003769;--f-display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-mono:system-ui,-apple-system,sans-serif;--r:26px;--rs:16px;color-scheme:light}
@media (prefers-color-scheme: dark){:root[data-design="modern"]:not([data-mode="light"]):not([data-theme="light"]){--bg:#08131f;--paper:#ffffff;--surface:#0f1e30;--sunk:#16283d;--ink:#e8eef5;--muted:#93a3b6;--line:#22374f;--accent:#7fb2e6;--accent-ink:#04121f;--accent-soft:#16304c;--brand:#e8eef5;--ok:#45c482;--ok-soft:#13291f;--danger:#ff6b5e;--danger-soft:#3a1916;--warn:#f2aa45;--warn-soft:#2d2210;--shadow:none;--navbg:#16304c;color-scheme:dark}}
:root[data-design="modern"][data-mode="dark"],:root[data-design="modern"][data-theme="dark"]:not([data-mode="light"]){--bg:#08131f;--paper:#ffffff;--surface:#0f1e30;--sunk:#16283d;--ink:#e8eef5;--muted:#93a3b6;--line:#22374f;--accent:#7fb2e6;--accent-ink:#04121f;--accent-soft:#16304c;--brand:#e8eef5;--ok:#45c482;--ok-soft:#13291f;--danger:#ff6b5e;--danger-soft:#3a1916;--warn:#f2aa45;--warn-soft:#2d2210;--shadow:none;--navbg:#16304c;color-scheme:dark}
:root[data-design="modern"] body{background:var(--bg)}
/* Karten */

:root[data-design="modern"] h1{color:var(--brand);font-weight:700;letter-spacing:-.025em}

:root[data-design="modern"] .btn{border-radius:99px;border:0;background:var(--sunk);color:var(--ink);font-weight:600}
:root[data-design="modern"] .btn.primary,:root[data-design="modern"] .fab{background:var(--accent);color:var(--accent-ink);box-shadow:none}

/* Gosch-Logo auf der Startseite */

@media (prefers-color-scheme: dark){:root[data-design="modern"]:not([data-theme="light"]):not([data-mode="light"]) .brand img{filter:brightness(0) invert(.92)}}

<script>/* Gemeinsame Helfer für alle Seiten von Oh-MyGosch: Dateien weitergeben, Gerätespeicher für Grundrisse. */
(function(){
  "use strict";
  // Designs Gosch und Klassisch gibt es nicht mehr: auf Modern umstellen
  try{ const d = localStorage.getItem("app.design"); if(d && d !== "neon" && d !== "modern") localStorage.setItem("app.design", "modern"); }catch(e){}
  // ---------- kleiner Hinweis unten ----------
  function toast(msg){
    let t = document.getElementById("gtToast");
    if(!t){ t = document.createElement("div"); t.id = "gtToast"; t.setAttribute("role","status");
      t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:#111;color:#fff;padding:10px 16px;border-radius:12px;font:500 14px/1.3 system-ui,-apple-system,sans-serif;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)";
      document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=>{ t.hidden = true; }, 3200);
  }
  // Teilen braucht auf dem iPhone manchmal einen frischen Tipp: dann einen Knopf anbieten
  function shareLater(file, label){
    let box = document.getElementById("gtShare");
    if(!box){ box = document.createElement("div"); box.id = "gtShare";
      box.style.cssText = "position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:61;display:flex;gap:8px;justify-content:center";
      box.innerHTML = '<button type="button" id="gtShareGo" style="flex:1;max-width:360px;height:50px;border:0;border-radius:14px;background:#003769;color:#fff;font:650 16px system-ui,-apple-system,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3)"></button><button type="button" id="gtShareX" aria-label="Schließen" style="width:50px;height:50px;border:0;border-radius:14px;background:#fff;color:#111;font:600 18px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.3)">✕</button>';
      document.body.appendChild(box);
      box.querySelector("#gtShareX").onclick = () => { box.hidden = true; box._f = null; };
      box.querySelector("#gtShareGo").onclick = async () => { const f = box._f; box.hidden = true; box._f = null; if(f){ try{ await navigator.share({files:[f]}); }catch(e){} } };
    }
    box._f = file; box.querySelector("#gtShareGo").textContent = label || "Datei teilen"; box.hidden = false;
  }
  // Datei ans iPhone übergeben: Teilen-Menü (Mail, Dateien …), sonst normaler Download
  async function deliver(blob, filename, label){
    // In der Claude-Testansicht: Speichern über Claude
    try{
      if(window.claude && window.claude.use){
        const d = await window.claude.use("downloads");
        if(d){ try{ await d.save({filename, data: blob}); toast("Gespeichert: " + filename); }
               catch(e){ if(!e || e.code !== "declined") toast("Die Datei konnte nicht gespeichert werden."); }
               return; }
      }
    }catch(e){}
    const file = new File([blob], filename, {type: blob.type || "application/octet-stream"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }
      catch(e){ if(e && e.name === "AbortError") return; shareLater(file, label); return; }
    }
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 5000);
    toast("Gespeichert: " + filename);
  }
  // ---------- Gerätespeicher (IndexedDB) für Grundrisse ----------
  let dbp = null;
  function open(){
    if(!dbp) dbp = new Promise((res, rej)=>{
      const r = indexedDB.open("gosch-tools", 1);
      r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains("blobs")) r.result.createObjectStore("blobs"); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn){
    const db = await open();
    return new Promise((res, rej)=>{ const t = db.transaction("blobs", mode); const out = fn(t.objectStore("blobs")); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  }
  const IDB = {
    put: (id, blob) => tx("readwrite", s => { s.put(blob, id); }),
    del: id => tx("readwrite", s => { s.delete(id); }),
    get: id => tx("readonly", s => s.get(id)),
    async all(){
      const db = await open();
      return new Promise((res, rej)=>{ const out = []; const t = db.transaction("blobs","readonly"); const c = t.objectStore("blobs").openCursor();
        c.onsuccess = () => { const cur = c.result; if(cur){ out.push([cur.key, cur.value]); cur.continue(); } };
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error); });
    }
  };
  const blobToData = b => new Promise((res, rej)=>{ const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
  async function dataToBlob(d){ const r = await fetch(d); return r.blob(); }
  async function blobsAsData(ids){
    const out = {};
    for(const id of new Set(ids.filter(Boolean))){ try{ const b = await IDB.get(id); if(b) out[id] = await blobToData(b); }catch(e){} }
    return out;
  }
  async function restoreBlobs(map){
    let n = 0;
    for(const [id, d] of Object.entries(map || {})){ try{ await IDB.put(id, await dataToBlob(d)); n++; }catch(e){ console.error(e); } }
    return n;
  }
  function persist(){ try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }
  function registerSW(){ if("serviceWorker" in navigator && location.protocol === "https:" && !(window.claude && window.claude.use)){ navigator.serviceWorker.register("sw.js").catch(()=>{}); } }
  // Zurück zum Startbildschirm
  // Zurück-Button: immer eine Ebene näher zur Startseite. Auf der obersten Ebene eines Bereichs -> Startseite.
  // Ein offenes Fenster wird zuerst geschlossen. (Kein history.back – das wäre „letzter Zustand“.)
  let backSet = false;
  function backLabel(top){ backSet = true; document.querySelectorAll(".backbtn").forEach(b => { b.textContent = top ? "‹ Startseite" : "‹ Zurück"; }); }
  document.addEventListener("DOMContentLoaded", () => { if(!backSet) backLabel(true); });
  let backFn = null;
  function setBack(fn){ backFn = fn || null; backLabel(!fn); }
  function home(ev){
    const open = [...document.querySelectorAll(".sheet-bg")].find(x => !x.hidden);
    if(open){ if(ev) ev.preventDefault(); const x = open.querySelector(".sheet-x"); if(x) x.click(); else open.hidden = true; return false; }
    if(backFn){ if(ev) ev.preventDefault(); backFn(); window.scrollTo(0, 0); return false; }
    return true;
  }
  // App nach mehr als 15 Minuten im Hintergrund wieder auf dem Startbildschirm öffnen
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => {
    if(document.hidden){ hiddenAt = Date.now(); return; }
    if(hiddenAt && Date.now() - hiddenAt > 15*60*1000 && !/(^|\/)(index\.html)?$/.test(location.pathname)){ location.replace("index.html"); }
    hiddenAt = 0;
  });

  // ---------- Geführte Einführung (Tour) ----------
  function tourCss(){
    if(document.getElementById("gtTourCss")) return;
    const st = document.createElement("style"); st.id = "gtTourCss";
    st.textContent = ".gt-tour{position:fixed;inset:0;z-index:200}"
      + ".gt-blur{position:fixed;inset:0;-webkit-backdrop-filter:blur(6px) saturate(.8);backdrop-filter:blur(6px) saturate(.8);transition:clip-path .25s}"
      + ".gt-tour.nospot{background:rgba(5,15,30,.5)}"
      + ".gt-spot{position:fixed;border-radius:18px;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 24px 4px rgba(255,255,255,.25),0 0 0 9999px rgba(5,15,30,.5);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s}"
      + ".gt-card{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--surface,#fff);color:var(--ink,#111);border-radius:22px;padding:16px 16px 14px;box-shadow:0 14px 40px rgba(0,0,0,.35);display:grid;gap:6px;font:15px/1.45 var(--f-body,system-ui,sans-serif)}"
      + ".gt-step{font-size:12px;color:var(--muted,#667);letter-spacing:.04em}"
      + ".gt-title{font:700 18px/1.25 var(--f-display,system-ui,sans-serif);color:var(--brand,var(--ink,#111))}"
      + ".gt-text{margin:0}"
      + ".gt-row{display:flex;gap:8px;align-items:center;margin-top:6px}"
      + ".gt-row button{border:0;border-radius:99px;height:42px;padding:0 16px;font:600 15px/1 var(--f-body,system-ui,sans-serif);cursor:pointer}"
      + ".gt-skip{background:none;color:var(--muted,#667);padding:0 4px!important}"
      + ".gt-back{background:var(--sunk,#eef);color:var(--ink,#111)}"
      + ".gt-next{background:var(--accent,#003769);color:var(--accent-ink,#fff)}";
    document.head.appendChild(st);
  }
  function tourDone(id){ try{ return !!(localStorage.getItem("app.tour.off") || localStorage.getItem("app.tour." + id)); }catch(e){ return true; } }
  let lastTour = null;
  function helpBtn(){

    opts = opts || {};
    return new Promise(resolve => {
      css(); if(box) box.remove();
      const c = cfg(), type = mode === "setPin" ? "pin" : mode === "setPw" ? "pw" : (c ? c.type : "pin");
      box = document.createElement("div"); box.id = "gtLock"; box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-labelledby", "gtLockT");
      box.innerHTML = '<div class="gl-in"><div class="gl-ic">' + IC_LOCK + '</div><h2 id="gtLockT"></h2><p class="gl-sub"></p>'
        + '<div class="gl-main"></div><p class="gl-err" role="alert"></p>'
        + '<button type="button" class="gl-link gl-bio" hidden></button>'
        + '<button type="button" class="gl-link gl-fg" hidden></button>'
        + '<button type="button" class="gl-link gl-cancel" hidden>Abbrechen</button></div>';
      document.body.appendChild(box);
      const $q = s => box.querySelector(s), title = $q("#gtLockT"), sub = $q(".gl-sub"), main = $q(".gl-main"), err = $q(".gl-err");
      const bioBtn = $q(".gl-bio"), fgBtn = $q(".gl-fg"), cancel = $q(".gl-cancel");
      const isSet = mode === "setPin" || mode === "setPw";
      const done = ok => { const b = box; box = null; if(b) b.remove(); document.removeEventListener("keydown", onKey, true); resolve(ok); };
      cancel.hidden = mode === "unlock"; cancel.onclick = () => done(false);
      let step = 1, first = "", val = "", onKey = () => {};
      const blocked = () => { const f = failInfo(); return f.until > Date.now() ? Math.ceil((f.until - Date.now()) / 1000) : 0; };
      const left = () => MAXF - failInfo().n;
      const showBlock = () => { const s = blocked(); if(!s) return false; err.textContent = "Zu viele Fehlversuche. Bitte " + s + " Sekunden warten. " + vers(left()); setTimeout(() => { if(box && !blocked()) err.textContent = ""; else if(box) showBlock(); }, 1000); return true; };
      async function tryUnlock(secret){
        if(showBlock()) return false;
        if(await checkSecret(secret)){ lset(FAILS, null); done(true); return true; }
        const f = addFail();
        if(f.n >= MAXF){ main.innerHTML = ""; bioBtn.hidden = true; fgBtn.hidden = true; cancel.hidden = true; title.textContent = "Daten gelöscht"; sub.textContent = "";
          err.textContent = MAXF + "-mal falsch eingegeben. Alle Daten der App wurden auf diesem Gerät gelöscht."; setTimeout(wipe, 2500); return false; }
        err.textContent = (type === "pin" ? "Falsche PIN." : "Falsches Passwort.") + (f.n >= 3 ? " " + vers(MAXF - f.n) : "");
        showBlock(); return false;
      }
      const texts = () => {
        if(mode === "unlock"){ title.textContent = "Oh-MyGosch ist gesperrt"; sub.textContent = type === "pin" ? "PIN eingeben" : "Passwort eingeben"; }
        else if(mode === "verify"){ title.textContent = opts.title || "Bestätigen"; sub.textContent = type === "pin" ? "Aktuelle PIN eingeben" : "Aktuelles Passwort eingeben"; }
        else if(mode === "setPin"){ title.textContent = step === 1 ? "Neue PIN" : "PIN wiederholen"; sub.textContent = step === 1 ? "4 bis 6 Ziffern" : "Zur Sicherheit noch einmal eingeben"; }
        else { title.textContent = "Neues Passwort"; sub.textContent = "Mindestens 6 Zeichen"; }
      };
      texts();
      if(type === "pin"){
        const maxLen = isSet ? (step === 1 ? 6 : first.length) : (c && c.len) || 6;
        main.innerHTML = '<div class="gl-dots" aria-hidden="true"></div><div class="gl-pad"></div>';
        const dots = $q(".gl-dots"), pad = $q(".gl-pad");
        const keys = ["1","2","3","4","5","6","7","8","9", "L", "0", "del"];
        pad.innerHTML = keys.map(k => k === "del" ? '<button type="button" class="fn" data-k="del" aria-label="Löschen">' + IC_DEL + '</button>'
          : k === "L" ? '<button type="button" class="fn" data-k="L"></button>'
          : '<button type="button" data-k="' + k + '">' + k + '</button>').join("");
        const L = pad.querySelector('[data-k="L"]');
        const lenNow = () => isSet ? (step === 1 ? 6 : first.length) : maxLen;
        const paint = () => { const n = isSet && step === 1 ? Math.max(4, val.length) : lenNow(); dots.innerHTML = Array.from({length:n}, (_, i) => '<i class="' + (i < val.length ? "on" : "") + '"></i>').join("");
          dots.setAttribute("aria-label", val.length + " Ziffern eingegeben");
          if(isSet && step === 1){ L.textContent = "OK"; L.disabled = val.length < 4; L.setAttribute("aria-label", "Weiter"); }
          else if(mode !== "setPin" && c && c.bio){ L.innerHTML = IC_BIO; L.disabled = false; L.setAttribute("aria-label", "Mit Biometrie entsperren"); }
          else { L.textContent = ""; L.disabled = true; L.removeAttribute("aria-label"); } };
        const shake = () => { dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake"); if(navigator.vibrate) try{ navigator.vibrate(80); }catch(e){} };
        async function full(){
          if(isSet){
            if(step === 1){ if(val.length < 4) return; first = val; val = ""; step = 2; err.textContent = ""; texts(); paint(); return; }
            if(val === first){ await makeSecret("pin", val, opts.keep); done(true); }
            else { err.textContent = "Die PINs stimmen nicht überein. Bitte neu eingeben."; shake(); step = 1; first = ""; val = ""; texts(); paint(); }
            return;
          }
          const v = val; val = ""; const ok = await tryUnlock(v); if(!ok){ shake(); paint(); }
        }
        function press(k){
          if(k === "del"){ val = val.slice(0, -1); paint(); return; }
          if(k === "L"){ if(isSet && step === 1) full(); else if(c && c.bio) runBio(); return; }
          if(blocked()){ showBlock(); return; }
          if(val.length >= lenNow()) return;
          val += k; err.textContent = err.textContent && val.length === 1 ? "" : err.textContent; paint();
          if(val.length === lenNow() && !(isSet && step === 1)) setTimeout(full, 120);
          else if(isSet && step === 1 && val.length === 6) setTimeout(full, 120);
        }
        pad.addEventListener("click", ev => { const b = ev.target.closest("[data-k]"); if(b && !b.disabled) press(b.dataset.k); });
        onKey = ev => { if(!box) return; if(/^[0-9]$/.test(ev.key)){ ev.preventDefault(); press(ev.key); } else if(ev.key === "Backspace"){ ev.preventDefault(); press("del"); } else if(ev.key === "Enter" && isSet && step === 1){ ev.preventDefault(); full(); } else if(ev.key === "Escape" && mode !== "unlock"){ done(false); } };
        document.addEventListener("keydown", onKey, true);
        paint();
      } else {
        if(mode === "setPw"){
          main.innerHTML = '<form class="gl-pw"><input type="password" id="glP1" autocomplete="new-password" placeholder="Neues Passwort" aria-label="Neues Passwort"><input type="password" id="glP2" autocomplete="new-password" placeholder="Passwort wiederholen" aria-label="Passwort wiederholen"><button class="gl-btn" type="submit">Passwort speichern</button></form>';
        } else {
          main.innerHTML = '<form class="gl-pw"><input type="password" id="glP1" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort"><button class="gl-btn" type="submit">Entsperren</button></form>';
        }
        const f = main.querySelector("form"), p1 = main.querySelector("#glP1"), p2 = main.querySelector("#glP2");
        f.addEventListener("submit", async ev => { ev.preventDefault();
          if(mode === "setPw"){
            if(p1.value.length < 6){ err.textContent = "Bitte mindestens 6 Zeichen."; p1.focus(); return; }
            if(p1.value !== p2.value){ err.textContent = "Die Passwörter stimmen nicht überein."; p2.value = ""; p2.focus(); return; }
            await makeSecret("pw", p1.value, opts.keep); done(true); return;
          }
          const ok = await tryUnlock(p1.value); if(!ok){ p1.value = ""; p1.focus(); } });
        onKey = ev => { if(ev.key === "Escape" && mode !== "unlock") done(false); };
        document.addEventListener("keydown", onKey, true);
        setTimeout(() => { if(mode !== "unlock" || !(c && c.bio)) p1.focus(); }, 60);
      }
      // Biometrie
      async function runBio(){
        if(busy) return; busy = true; err.textContent = "";
        try{ if(await bioCheck()){ lset(FAILS, null); done(true); } else err.textContent = "Nicht erkannt. Bitte erneut versuchen oder " + (type === "pin" ? "PIN" : "Passwort") + " eingeben."; }
        catch(e){ if(e && e.name !== "NotAllowedError" && e.name !== "AbortError") err.textContent = "Biometrie ist gerade nicht möglich. Bitte " + (type === "pin" ? "PIN" : "Passwort") + " eingeben."; }
        finally{ busy = null; }
      }
      if(!isSet && c && c.bio){ bioBtn.hidden = false; bioBtn.textContent = "Mit Face ID / Fingerabdruck entsperren"; bioBtn.onclick = runBio; if(opts.autoBio) setTimeout(runBio, 250); }
      // Vergessen
      if(mode === "unlock"){
        fgBtn.hidden = false; fgBtn.textContent = type === "pin" ? "PIN vergessen?" : "Passwort vergessen?";
        fgBtn.onclick = () => {
          const keep = main.innerHTML; fgBtn.hidden = true; bioBtn.hidden = true; err.textContent = "";
          title.textContent = type === "pin" ? "PIN vergessen" : "Passwort vergessen"; sub.textContent = "";
          main.innerHTML = '<div class="gl-forgot"><p>Ohne ' + (type === "pin" ? "PIN" : "Passwort") + ' kommt niemand an die Daten – auch nicht der Entwickler. Du kannst nur alle Daten der App auf diesem Gerät löschen und neu anfangen. Achtung: Nach ' + MAXF + ' falschen Eingaben passiert das automatisch. Danach kannst du eine Datensicherung einlesen, falls du eine hast.</p><button type="button" class="gl-btn danger" id="glWipe">Alle Daten löschen</button><button type="button" class="gl-btn sec" id="glBack">Zurück</button></div>';
          main.querySelector("#glBack").onclick = () => { document.removeEventListener("keydown", onKey, true); if(box){ box.remove(); box = null; } showing = false; lockNow(); };
          const w = main.querySelector("#glWipe");
          w.onclick = () => { if(w.dataset.armed !== "1"){ w.dataset.armed = "1"; w.textContent = "Wirklich alles löschen?"; return; } wipe(); };
        };
      }
    });
  }
  // Warnung vor dem Einrichten: Hintergrund unscharf wie im Tutorial
  function warn(){
    return new Promise(resolve => {
      css();
      const w = document.createElement("div"); w.id = "gtLockWarn"; w.setAttribute("role", "alertdialog"); w.setAttribute("aria-modal", "true"); w.setAttribute("aria-labelledby", "glwT"); w.setAttribute("aria-describedby", "glwD");
      w.innerHTML = '<div class="glw-card"><div class="glw-ic"><svg viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19L12 3.5z"/><path d="M12 10v4.5M12 17.3v.2"/></svg></div>'
        + '<b id="glwT">Wichtig – bitte lesen</b>'
        + '<div id="glwD"><p>Nach <b>' + MAXF + ' falschen Eingaben</b> von PIN oder Passwort werden <b>alle Daten der App auf diesem Gerät gelöscht</b>: Stundenzettel, Urlaubsanträge, Brandmeldeanlagen mit Grundrissen und deine Unterschrift.</p>'
        + '<p>Das lässt sich <b>nicht rückgängig machen</b>. Merk dir PIN oder Passwort gut und mach regelmäßig eine Datensicherung (Einstellungen → Datensicherung).</p></div>'
        + '<div class="glw-row"><button type="button" class="glw-no">Abbrechen</button><button type="button" class="glw-ok">Verstanden</button></div></div>';
      document.body.appendChild(w);
      const end = ok => { w.remove(); document.removeEventListener("keydown", k, true); resolve(ok); };
      const k = ev => { if(ev.key === "Escape"){ ev.preventDefault(); end(false); } };
      document.addEventListener("keydown", k, true);
      w.querySelector(".glw-ok").onclick = () => end(true); w.querySelector(".glw-no").onclick = () => end(false);
      setTimeout(() => w.querySelector(".glw-ok").focus(), 50);
    });
  }
  async function wipe(){
    try{ localStorage.clear(); }catch(e){} try{ sessionStorage.clear(); }catch(e){}
    try{ await new Promise(r => { const q = indexedDB.deleteDatabase("gosch-tools"); q.onsuccess = q.onerror = q.onblocked = () => r(); setTimeout(r, 1500); }); }catch(e){}
    location.href = "index.html";
  }

  // ---------- Wann sperren ----------
  const grace = c => Math.max(5, (c.after || 0)) * 1000;
  function needLockNow(){
    const c = cfg(); if(!c) return false;
    const u = sget(S_UNL); if(!u) return true;
    const h = sget(S_HID); if(!h) return false;
    if(sget(S_NAV) >= h - 1500) return false; // Wechsel zwischen den Seiten der App
    return Date.now() - h > grace(c);
  }
  function unlocked(){ sset(S_UNL, Date.now()); sset(S_HID, null); document.documentElement.classList.remove("gt-locked"); }
  let showing = false;
  async function lockNow(){
    if(showing || !cfg()) return; showing = true; sset(S_UNL, null);
    css(); document.documentElement.classList.add("gt-locked");
    const ok = await open("unlock", {autoBio:true}); showing = false; if(ok) unlocked();
  }
  function start(){
    if(!cfg()) return;
    if(needLockNow()){ css(); document.documentElement.classList.add("gt-locked"); const go = () => lockNow(); if(document.body) go(); else document.addEventListener("DOMContentLoaded", go); }
    else sset(S_HID, null);
    document.addEventListener("visibilitychange", () => {
      if(!cfg()) return;
      if(document.visibilityState === "hidden"){ if(!showing) sset(S_HID, Date.now()); }
      else { const h = sget(S_HID); if(h && !showing && Date.now() - h > grace(cfg())) lockNow(); else sset(S_HID, null); }
    });
    window.addEventListener("pagehide", () => sset(S_NAV, Date.now()));
    document.addEventListener("click", ev => { const a = ev.target.closest && ev.target.closest("a[href]"); if(a) sset(S_NAV, Date.now()); }, true);
    window.addEventListener("pageshow", ev => { if(ev.persisted && needLockNow()) lockNow(); });
  }

  // ---------- Schnittstelle für die Einstellungen ----------
  const API = {
    config: () => { const c = cfg(); return c ? {type:c.type, bio:!!c.bio, after:c.after || 0} : null; },
    verify: title => cfg() ? open("verify", {title}) : Promise.resolve(true),
    setup: async type => { const old = cfg(); const keep = old ? {after:old.after || 0, bio:old.bio || null} : {after:0, bio:null}; if(!(await warn())) return false; const ok = await open(type === "pw" ? "setPw" : "setPin", {keep}); if(ok) unlocked(); return ok; },
    off: () => { lset(KEY, null); lset(FAILS, null); },
    setAfter: s => { const c = cfg(); if(c){ c.after = s; lset(KEY, c); } },
    bioAvailable,
    bioOn: async () => { const c = cfg(); if(!c) return false; const id = await bioRegister(); c.bio = id; lset(KEY, c); return true; },
    bioOff: () => { const c = cfg(); if(c){ c.bio = null; lset(KEY, c); } },
    lockNow
  };
  const attach = () => { if(window.GT) window.GT.lock = API; else setTimeout(attach, 0); };
  attach();
  try{ start(); }catch(e){}
})();
</script>
