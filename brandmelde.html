/* ---------- Akku ---------- */
const BAT = '<svg class="bat" viewBox="0 0 24 24"><rect x="2.5" y="7" width="17" height="10" rx="2"/><path d="M21.5 10.5v3"/><path d="M6 10v4M9.5 10v4"/></svg>';
const pad2 = n => String(n).padStart(2,"0");
const dstr = d => `${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()}`;
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
function akku(a){
  if(!a || !a.akkuDatum) return {st:"none"};
  const jahre = parseFloat(String(a.akkuJahre||"").replace(",", ".")) || parseFloat(String(S.einst.akkuJahre||"").replace(",", ".")) || 4;
  const warnM = parseInt(S.einst.akkuWarn,10) || 3;
  const ein = new Date(a.akkuDatum+"T00:00:00");
  const due = new Date(ein); due.setMonth(due.getMonth() + Math.round(jahre*12));
  const warn = new Date(due); warn.setMonth(warn.getMonth() - warnM);
  const t = new Date(); t.setHours(0,0,0,0);
  const days = Math.round((due - t) / 864e5);
  const st = days <= 0 ? "over" : t >= warn ? "soon" : "ok";
  return {st, due, days, jahre, ein};
}
function akkuText(ak){
  if(ak.st==="none") return {t:"Akku: Einbaudatum fehlt", s:"Trage ein, wann der Akku eingebaut wurde."};
  const d = Math.abs(ak.days), rel = d < 60 ? plural(d,"Tag","Tagen") : `${Math.round(d/30.44)} Monaten`;
  if(ak.st==="over") return {t: ak.days===0 ? "Akkutausch heute fällig" : `Akkutausch überfällig seit ${rel}`, s:`Fällig war er am ${dstr(ak.due)}`};
  if(ak.st==="soon") return {t:`Akkutausch in ${rel} fällig`, s:`Spätestens bis ${dstr(ak.due)}`};
  return {t:`Akku ok – Tausch ${pad2(ak.due.getMonth()+1)}/${ak.due.getFullYear()}`, s:`Eingebaut ${dstr(ak.ein)} · Wechsel alle ${String(ak.jahre).replace(".",",")} Jahre`};
}
// "2× 12 V / 17 Ah" – was eingepackt werden muss
function akkuPack(a){
  const n = parseInt(a.akkuAnz,10), t = (a.akkuTyp||"").trim();
  if(!t && !n) return "";
  return `${n ? n+"× " : ""}${t || "Akku (Typ fehlt)"}`;
}
// Vorschau im Formular: was folgt aus Einbaudatum + Intervall?
function akkuVorschau(datum, jahre){
  if(!datum) return "Ohne Einbaudatum gibt es keine Akku-Warnung.";
  const ak = akku({akkuDatum:datum, akkuJahre:jahre});
  if(ak.st==="none") return "";
  const warnM = parseInt(S.einst.akkuWarn,10) || 3, w = new Date(ak.due); w.setMonth(w.getMonth()-warnM);
  const zust = ak.st==="over" ? `<b class="bad">überfällig</b>` : ak.st==="soon" ? `<b class="soon">bald fällig</b>` : `<b class="ok">ok</b>`;
  return `→ Tausch fällig am <b>${dstr(ak.due)}</b>, Warnung ab ${dstr(w)} · heute: ${zust}`;
}
function akkuChip(a){
  const ak = akku(a); if(ak.st!=="soon" && ak.st!=="over") return "";
  const pk = akkuPack(a);
  return `<span class="achip ${ak.st}">${BAT}${esc(akkuText(ak).t)}${pk ? ` · ${esc(pk)}` : " · Akku-Typ fehlt"}</span>`;
}
const akkuFaellig = () => list("anlagen").map(a=>({a, ak:akku(a)})).filter(x=>x.ak.st==="soon"||x.ak.st==="over").sort((x,y)=>x.ak.days-y.ak.days);

/* ---------- Quartalsplan ---------- */
const curY = () => new Date().getFullYear();
const curQ = () => Math.floor(new Date().getMonth()/3) + 1;
const Q_MON = ["Jan–Mär","Apr–Jun","Jul–Sep","Okt–Dez"];
// Wirksamer Status: Bei Anlagen mit Quartalsplan zählt nur, was im laufenden Jahr geprüft wurde.
function mst(m){
  const a = S.anlagen[m.anlageId];
  if(a && a.qplan) return (m.status && m.am && new Date(m.am).getFullYear()===curY()) ? m.status : "";
  return m.status || "";
}
// Quartale vor dem Planstart im selben Jahr gelten nicht als versäumt.
function startQ(a){
  const e = a && a.qplan && a.qplan.erstellt ? new Date(a.qplan.erstellt) : null;
  return e && e.getFullYear()===curY() ? Math.floor(e.getMonth()/3)+1 : 1;
}
function qStats(aid){
  const ms = list("melder", m=>m.anlageId===aid), cq = curQ(), sq = startQ(S.anlagen[aid]);
  const q = [1,2,3,4].map(n=>{ const xs = ms.filter(m=>m.q===n); const done = xs.filter(m=>mst(m)).length; return {n, total:xs.length, done, open:xs.length-done}; });
  const nach = q.filter(x=>x.n<cq && x.n>=sq).reduce((s,x)=>s+x.open,0);
  const jetzt = ms.filter(m=>m.q && m.q<=cq && m.q>=sq && !mst(m)).length;
  const done = ms.filter(m=>mst(m)).length;
  return {q, cq, sq, nach, jetzt, done, total:ms.length, ohne: ms.filter(m=>!m.q).length};
}

// Aufteilung nach DIN VDE 0833-1 (Bezug aus DIN 14675): Inspektion vierteljährlich,
// jeder Melder mindestens einmal im Jahr. Regel je Gruppe nach Melder-Nr.:
// Melder 1 → Q1, 2 → Q2, 3 → Q3, 4 → Q4, 5 → Q1 …
const qRegel = nr => ((Math.max(1, nr|0) - 1) % 4) + 1;
function quartalsAufteilung(aid){
  const out = new Map();
  gruppen(aid).forEach(g=>melder(g.id).forEach(m=>out.set(m.id, qRegel(m.nr))));
  return out;
}

// Im laufenden Jahr schon geprüft? (unabhängig davon, ob schon ein Plan besteht)
const imJahrGeprueft = m => !!(m.status && m.am && new Date(m.am).getFullYear()===curY());

// Teiljahr: Plan wird mitten im Jahr erstellt (oder neu verteilt).
// Noch nicht geprüfte Melder kommen reihum auf das aktuelle und die restlichen Quartale,
// schon geprüfte zählen für dieses Jahr als erledigt und bekommen ihr reguläres Quartal fürs nächste Jahr.
function teiljahrAufteilung(aid){
  const cq = curQ(), rest = [];
  for(let q=cq; q<=4; q++) rest.push(q);
  const out = new Map(); let i = 0;
  gruppen(aid).forEach(g=>melder(g.id).forEach(m=>{
    if(imJahrGeprueft(m)) out.set(m.id, qRegel(m.nr));
    else { out.set(m.id, rest[i % rest.length]); i++; }
  }));
  return out;
}

async function planErstellen(aid){
  const a = S.anlagen[aid] || {};
  const cq = curQ(), y = curY();
  // Mitten im Jahr: Restjahr-Verteilung. Ab Januar bzw. bei Start in Q1: reguläre Regel.
  const teil = cq > 1;
  const plan = teil ? teiljahrAufteilung(aid) : quartalsAufteilung(aid);
  if(!plan.size){ toast("Lege zuerst Meldergruppen und Melder an."); return; }
  toast("Quartalsplan wird erstellt …");
  for(const [id,q] of plan) if(S.melder[id] && (S.melder[id].q!==q || S.melder[id].qOrig)) await upd("melder", id, {q, qOrig:null});
  const erstellt = a.qplan && a.qplan.erstellt && new Date(a.qplan.erstellt).getFullYear()===y ? a.qplan.erstellt : new Date().toISOString();
  await upd("anlagen", aid, {qplan:{erstellt, jahr:y, teiljahr:teil}});
  const offen = [...plan].filter(([id])=>S.melder[id] && !imJahrGeprueft(S.melder[id]));
  const c = [1,2,3,4].map(n=>offen.filter(([,v])=>v===n).length);
  ui.qf = null; render();
  toast(teil ? `Restjahr ${y}: ${c.map((v,k)=>v?`Q${k+1}: ${v}`:"").filter(Boolean).join(" · ") || "alle Melder schon geprüft"} · ab ${y+1} normale Verteilung`
             : `Quartalsplan erstellt: ${c.map((v,k)=>`Q${k+1}: ${v}`).join(" · ")}`);
}

// Jahreswechsel: Teiljahres-Plan einmalig auf die reguläre Verteilung umstellen
let jahresCheckLaeuft = false;
async function jahreswechselPruefen(){
  if(jahresCheckLaeuft) return; jahresCheckLaeuft = true;
  try{
    for(const a of list("anlagen", x=>x.qplan && x.qplan.teiljahr && (x.qplan.jahr||new Date(x.qplan.erstellt).getFullYear()) < curY())){
      for(const [id,q] of quartalsAufteilung(a.id)) if(S.melder[id] && (S.melder[id].q!==q || S.melder[id].qOrig)) await upd("melder", id, {q, qOrig:null});
      await upd("anlagen", a.id, {qplan:{...a.qplan, teiljahr:false, jahr:curY()}});
    }
  } finally { jahresCheckLaeuft = false; }
}
async function planEntfernen(aid){
  for(const m of list("melder", m=>m.anlageId===aid && m.q)) await upd("melder", m.id, {q:null});
  await upd("anlagen", aid, {qplan:null});
  ui.qf = null; render(); toast("Quartalsplan entfernt.");
}
// Neue Melder: ins Quartal mit den wenigsten Meldern (Viertelung bleibt erhalten),
// bei Gleichstand bevorzugt das Quartal der eigenen Gruppe.
function quartalFuerNeue(aid, gid, extra){
  const inG = melder(gid).map(m=>m.q).filter(Boolean);
  const qs = qStats(aid).q.map(x=>({n:x.n, t:x.total + (extra[x.n]||0)}));
  const min = Math.min(...qs.map(x=>x.t));
  const cand = qs.filter(x=>x.t===min).map(x=>x.n);
  return cand.find(n=>inG.includes(n)) || cand[0];
}

function quartalKarte(a){
  const aid = a.id, all = list("melder", m=>m.anlageId===aid);
  if(!a.qplan){
    if(!all.length) return `<div class="empty"><h2>Noch keine Melder</h2><p>Lege unter „Prüfung“ zuerst Meldergruppen und Melder an. Danach erstellst du hier den Quartalsplan.</p></div>`;
    return `<section class="qplan intro"><div class="it"><b>Quartalsplan erstellen</b><span>Nach DIN VDE 0833-1 / DIN 14675: Inspektion vierteljährlich, jeder Melder mindestens einmal im Jahr. Die App verteilt die ${all.length} Melder je Gruppe reihum: Melder 1 → Q1, 2 → Q2, 3 → Q3, 4 → Q4, 5 → Q1 …${curQ()>1 ? ` Da das Jahr schon läuft, kommen dieses Jahr nur die noch nicht geprüften Melder auf Q${curQ()}${curQ()<4?"–Q4":""}.` : ""}</span></div>
      <button class="btn small primary" data-a="qplan">Plan erstellen</button></section>`;
  }
  const qs = qStats(aid), y = curY();
  let h = `<section class="qplan"><div class="qhead"><b>Quartalsplan ${y}</b><span>${qs.done} von ${qs.total} geprüft</span></div>
    <div class="qbar"><i style="width:${qs.total ? qs.done/qs.total*100 : 0}%"></i></div>
    <div class="qtiles">${qs.q.map(x=>{
      const vor = x.n < qs.sq, past = x.n < qs.cq && !vor, cur = x.n===qs.cq;
      const cls = [cur?"cur":"", vor?"vor":"", past && x.open ? "late" : "", x.total && !x.open ? "done" : "", ui.pq===x.n ? "sel" : ""].join(" ");
      const sub = !x.total ? "–" : !x.open ? "erledigt" : vor ? "vor Planstart" : past ? `${x.open} nachholen` : `${x.open} offen`;
      return `<button class="qt ${cls}" data-a="pq" data-v="${x.n}" aria-pressed="${ui.pq===x.n}"><span class="ql">Q${x.n}${cur?" · jetzt":""}</span><b>${x.done}/${x.total}</b><span class="qs">${sub}</span><span class="qm">${Q_MON[x.n-1]}</span></button>`;
    }).join("")}</div>`;
  if(qs.jetzt) h += `<button class="btn ${qs.nach ? "warnbtn" : "primary"} qnow" data-a="zupruef">Zur Prüfung Q${qs.cq}: ${qs.q[qs.cq-1].open} offen${qs.nach ? ` · ${qs.nach} aus Vorquartalen` : ""} ›</button>`;
  else if(qs.total && qs.cq===4 && qs.done===qs.total) h += `<p class="qok">Alle Melder für ${y} geprüft.</p>`;
  h += `<p class="qnorm">Melder 1 → Q1, 2 → Q2, 3 → Q3, 4 → Q4 … · DIN VDE 0833-1</p>`;
  if(a.qplan.teiljahr) h += `<p class="qnorm">Restjahr ${curY()}: noch offene Melder sind auf Q${qs.sq}${qs.sq<4?"–Q4":""} verteilt, bereits geprüfte zählen als erledigt. Ab 1.1.${curY()+1} gilt automatisch die normale Verteilung.</p>`;
  else if(qs.sq>1) h += `<p class="qnorm">Plan gestartet in Q${qs.sq} ${curY()}: Q1${qs.sq>2?"–Q"+(qs.sq-1):""} zählen ab ${curY()+1}.</p>`;
  return h + `</section>`;
}

    return h + `<div class="empty">

      return {items:Object.values(sum), miss}; })();
    const nAnl = new Set(mgOffen.map(x=>x.anlageId)).size;
    const open = ui.alertOpen;
    h += `<div class="alerts ${fa.length && mgOffen.length ? "two" : ""}">
      ${fa.length ? `<button class="atile ${over?"over":"soon"} ${open==="akku"?"open":""}" data-a="alertopen" data-v="akku" aria-expanded="${open==="akku"}">
        <span class="at-h">${BAT}<b>Akkutausch</b><span class="chev"></span></span>
        <span class="at-n">${plural(fa.length,"Anlage","Anlagen")}</span>

      </button>` : ""}
      ${mgOffen.length ? `<button class="atile mg ${open==="mg"?"open":""}" data-a="alertopen" data-v="mg" aria-expanded="${open==="mg"}">
        <span class="at-h"><span class="at-ic">⚠</span><b>Mängel</b><span class="chev"></span></span>
        <span class="at-n">${mgOffen.length} offen</span>

    if(open==="akku" && fa.length){
      h += `<section class="alarm ${over?"over":"soon"} open">${fa.map(({a,ak})=>{ const k = hasKunde(a) ? S.kunden[a.kundeId] : null; const pk = akkuPack(a);
        return `<button class="arow" data-a="goakku" data-id="${a.id}"><span class="it"><b>${esc(a.name)}</b><span>${esc(k ? k.name : "Ohne Kunde")}</span><span class="apack ${pk?"":"miss"}">${pk ? `${BAT}${esc(pk)}` : "Akku-Typ fehlt"}</span></span><span class="adue ${ak.st}">${esc(ak.st==="over" ? "Überfällig" : (ak.days<60 ? plural(ak.days,"Tag","Tage") : Math.round(ak.days/30.44)+" Mon."))}<small>${dstr(ak.due)}</small></span><span class="go"></span></button>`; }).join("")}
        ${pack.items.length ? `<div class="apacklist"><b>Einpacken:</b> ${pack.items.map(x=>`${x.n}× ${esc(x.t)}`).join(", ")}${pack.miss ? ` <span>(+ ${plural(pack.miss,"Anlage","Anlagen")} ohne Akku-Typ)</span>` : ""}</div>` : ""}
      </section>`;
    }
    if(open==="mg" && mgOffen.length){
      h += `<section class="alarm mgl open">${mgOffen.map(x=>{ const a = S.anlagen[x.anlageId], k = hasKunde(a) ? S.kunden[a.kundeId] : null;
        return `<button class="arow" data-a="gomaengel" data-id="${x.anlageId}"><span class="it"><b>${mAdr(x)} · ${esc(a.name)}</b><span>${esc(k ? k.name : "Ohne Kunde")}</span><span class="mtxtk">${x.text ? esc(x.text) : "Keine Notiz"}</span></span><span class="adue mg">${dstr(new Date(x.am)).slice(0,6)}</span><span class="go"></span></button>`; }).join("")}
      </section>`;
    }
  }
  h += `<div class="tools">
    <input id="q" class="search" type="search" placeholder="Kunde, Kundennr. oder Ort suchen" value="${esc(ui.q)}" autocomplete="off">
    ${ui.form==="kunde" ? "" : `<button class="btn primary" data-a="form" data-v="kunde">+ Kunde</button>`}
  </div>`;
  if(ui.form==="kunde") h += kundeForm(null);

  if(ks.length){
    h += `<div class="list">${ks.map(k=>{
      const as = anlagenVon(k.id), st = stats(as.map(a=>a.id));
      return `<div class="krow ${k.id===ui.kunde?"sel":""}"><button class="item" data-a="ksel" data-id="${k.id}" aria-pressed="${k.id===ui.kunde}">
        <span class="kradio" aria-hidden="true"></span>
        <span class="knr">${esc(k.nr||"–")}</span>
        <span class="it"><b>${esc(k.name)}</b><span>${esc([k.plz,k.ort].filter(Boolean).join(" ")||"Keine Adresse")}${k.ansprech?" · "+esc(k.ansprech):""}</span>${(()=>{ const f = as.map(a=>akku(a)).filter(x=>x.st==="soon"||x.st==="over"); if(!f.length) return ""; const over = f.some(x=>x.st==="over"); return `<span class="achip ${over?"over":"soon"}">${BAT}Akkutausch fällig: ${plural(f.length,"Anlage","Anlagen")}${over?` (${f.filter(x=>x.st==="over").length} überfällig)`:""}</span>`; })()}${(()=>{ const n = as.reduce((s,a)=>s+maengelVon(a.id).filter(x=>x.status!=="erledigt").length,0); return n ? `<span class="achip mgc">⚠ ${plural(n,"offener Mangel","offene Mängel")}</span>` : ""; })()}</span>
        <span class="pills"><span class="pill">${plural(as.length,"Anlage","Anlagen")}</span></span>
      </button><button class="kopen" data-a="go" data-v="kunde" data-id="${k.id}" aria-label="Kundenstamm von ${esc(k.name)} öffnen"><span class="go"></span></button></div>`;}).join("")}</div>`;
  } else if(q){
    h += `<p class="hint">Kein Kunde passt zu „${esc(ui.q)}“.</p>`;
  }
  if(ohne.length && !q){
    h += `<div class="list"><button class="item" data-a="go" data-v="kunde" data-id="_none">
      <span class="knr">?</span><span class="it"><b>Anlagen ohne Kunde</b><span>${plural(ohne.length,"Anlage","Anlagen")} einem Kunden zuordnen</span></span><span class="go"></span></button></div>`;
  }
  return h;
}

function anlageItem(a){
  const s = stats([a.id]), pct = s.total ? (s.ok+s.mg)/s.total*100 : 0;
  const pill = !s.total ? `<span class="pill">Leer</span>` : s.mg ? `<span class="pill warn">${plural(s.mg,"Mangel","Mängel")}</span>` : !s.offen ? `<span class="pill ok">Geprüft</span>` : `<span class="pill">${s.offen} offen</span>`;
  const line = `${esc(a.ort||"")}${a.ort?" · ":""}${s.total} Melder`;
  return `<button class="item" data-a="go" data-v="anlage" data-id="${a.id}">
    <span class="it"><b>${esc(a.name)}</b><span>${line}</span>${(()=>{ // wichtigster Hinweis zuerst, nur einer
      const ak = akku(a), qs = a.qplan ? qStats(a.id) : null;
      if(ak.st==="over") return akkuChip(a);
      if(qs && qs.nach) return `<span class="achip over">${qs.nach} Melder nachholen</span>`;
      if(ak.st==="soon") return akkuChip(a);
      if(qs){ const c = qs.q[qs.cq-1]; return c.open ? `<span class="achip qcur">Q${qs.cq}: ${c.open} offen</span>` : c.total ? `<span class="achip qok">Q${qs.cq} erledigt</span>` : ""; }
      return ""; })()}<span class="mini"><i style="width:${pct}%"></i></span></span>
    <span class="pills">${pill}</span><span class="go"></span>

}

// Hinweise beim Kunden: Akku-Warnungen und offene Mängel, jeweils direkt anklickbar
function kundeHinweise(as){
  const rows = [];
  for(const a of as){
    const ak = akku(a);
    if(ak.st==="over" || ak.st==="soon"){
      const pk = akkuPack(a);
      rows.push({prio: ak.st==="over" ? 0 : 2, html:`<button class="hrow ${ak.st}" data-a="goakku" data-id="${a.id}">
        <span class="hic">${BAT}</span><span class="it"><b>${esc(a.name)}</b><span>${esc(akkuText(ak).t)}${pk ? " · "+esc(pk) : ""}</span></span><span class="go"></span></button>`});
    }
    const om = maengelVon(a.id).filter(x=>x.status!=="erledigt");
    if(om.length){
      const vorschau = om.slice(0,2).map(x=>`${mAdr(x)}${x.text ? " "+x.text : ""}`).join(" · ") + (om.length>2 ? " …" : "");
      rows.push({prio:1, html:`<button class="hrow mg" data-a="gomaengel" data-id="${a.id}">
        <span class="hic">⚠</span><span class="it"><b>${esc(a.name)}</b><span>${plural(om.length,"offener Mangel","offene Mängel")}: ${esc(vorschau)}</span></span><span class="go"></span></button>`});
    }
  }
  if(!rows.length) return "";
  rows.sort((x,y)=>x.prio-y.prio);
  return `<section class="hinweise"><h2>Hinweise</h2>${rows.map(r=>r.html).join("")}</section>`;
}

function viewAnlagen(){
  const kid = ui.kunde, none = kid==="_none", k = S.kunden[kid];
  if(!k && !none){
    return backRow() + `<header class="panel"><div class="strip"><h1>Anlagen</h1></div></header>

  let as = all.filter(a=> !q || [a.name,a.ort,a.bmz].some(v=>String(v||"").toLowerCase().includes(q)));
  if(ui.afilter!=="alle") as = as.filter(a=>{ const s = stats([a.id]); return ui.afilter==="mangel" ? s.mg>0 : s.offen>0; });
  const st = stats(all.map(a=>a.id));

  let h = backRow() + `<header class="panel">

    </header>`;

  if(!all.length && ui.form!=="anlage"){
    return h + `<div class="empty"><h2>Noch keine Anlagen</h2>
      <p>Für ${esc(k ? k.name : "diesen Kunden")} ist noch keine Brandmeldeanlage angelegt, z. B. „BMA Hauptgebäude“.</p>
      <div class="tools"><button class="btn primary" data-a="form" data-v="anlage">+ Anlage</button></div></div>`;
  }

  if(all.length > 3) h += `<div class="tools"><input id="qa" class="search" type="search" placeholder="Anlage oder Standort suchen" value="${esc(ui.qa)}" autocomplete="off"></div>`;
  h += `<div class="tools"><div class="seg" role="group" aria-label="Filter">

    h += `<p class="hint">Keine Anlage passt zu Suche oder Filter.</p>`;

  return h;
}

    <button role="tab" data-a="atab" data-v="schall" aria-pressed="${schall}" aria-selected="${schall}">Schallpegel</button>
  </div>
  ${inPruef ? `<div class="subtabs" role="tablist" aria-label="Prüfung">
    <button role="tab" data-a="atab" data-v="pruefung" aria-selected="${!mtab && !prot && !ueb}">Melder</button>
    <button role="tab" data-a="atab" data-v="maengel" aria-selected="${mtab}">Mängel${nOffen ? ` <span class="mcount">${nOffen}</span>` : ""}</button>
    <button role="tab" data-a="atab" data-v="prot" aria-selected="${prot}">Protokoll</button>
    <button role="tab" data-a="atab" data-v="ueb" aria-selected="${ueb}">Überbrückung</button>
  </div>` : ""}`;

  h += plan ? planTab({id:aid, ...a}) : prot ? protokollTab({id:aid, ...a}) : schall ? schallTab({id:aid, ...a}) : mtab ? maengelTab({id:aid, ...a}) : ueb ? calcKarte({id:aid, ...a}, true) : pruefTab({id:aid, ...a}, k, st, pct);

  const np = k && inPruef && !prot && !ueb ? plaeneVon(a.kundeId).length : 0;
  if(np) h += `<button class="fab" data-a="openplan" data-id="${a.kundeId}"><svg viewBox="0 0 24 24"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Grundriss${np>1?` (${np})`:""}</button>`;
  return h;
}

function akkuSeite(a, k){
  const ak = akku(a), pk = akkuPack(a);
  return `<header class="panel">
    <div class="strip">${backBtn()}</div>
    <div class="sub"><span class="kn">${esc([k ? k.name : "", a.name].filter(Boolean).join(" · "))}</span><span class="nm">Akku</span></div>
  </header>
  ${ui.form==="anlageEdit" ? anlageForm(a) : akkuMenue(a, ak, pk)}`;
}

function akkuBlock(a){
  const ak = akku(a), tx = akkuText(ak), pk = akkuPack(a), due = ak.st==="soon" || ak.st==="over", open = !!ui.akkuPanel;
  // Kompakte Anzeige – antippen öffnet das Akku-Menü
  let h = due
    ? `<button class="akku ${ak.st} akkubtn" data-a="akkupanel"><span class="aic">${BAT}</span><span class="it"><b>${esc(tx.t)}</b><span>${esc(tx.s)}</span>
        ${pk ? `<span class="apack">Einpacken: <strong>${esc(pk)}</strong></span>` : `<span class="apack miss">Akku-Typ fehlt</span>`}</span><span class="go"></span></button>`
    : `<button class="akkuline akkubtn ${ak.st}" data-a="akkupanel">${BAT}<span>${ak.st==="none" ? "Akku: Einbaudatum fehlt" : esc(tx.t)}${pk && ak.st!=="none" ? " · "+esc(pk) : ""}</span><span class="go"></span></button>`;
  return h;
}

// Akku-Menü: Informationen, Tausch eintragen, Verlauf der getauschten Akkus
function akkuMenue(a, ak, pk){
  const warnM = parseInt(S.einst.akkuWarn,10) || 3;
  const w = ak.due ? new Date(ak.due) : null; if(w) w.setMonth(w.getMonth()-warnM);
  const c = a.calc ? ueberbrueckung(calcWerte(a, false)) : null;
  const zeile = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : "";
  // Verlauf: neue Einträge (akkuLog) + ältere Einbaudaten (akkuHist)
  const logs = (a.akkuLog||[]).map(x=>({...x}));
  const alt = (a.akkuHist||[]).filter(d=>!logs.some(x=>x.vorher===d)).map(d=>({altEinbau:d}));
  const verlauf = [...logs.sort((x,y)=>(y.am||"").localeCompare(x.am||"")), ...alt.sort((x,y)=>y.altEinbau.localeCompare(x.altEinbau))];
  let h = `<section class="akkumenu">
    <dl class="kv">
      ${zeile("Zustand", ak.st==="none" ? "Einbaudatum fehlt" : `<b class="ak-${ak.st}">${esc(akkuText(ak).t)}</b>`)}
      ${zeile("Eingebaut", a.akkuDatum ? dstr(new Date(a.akkuDatum+"T00:00:00")) : "")}
      ${zeile("Wechsel", ak.jahre ? `alle ${String(ak.jahre).replace(".",",")} Jahre` : "")}
      ${zeile("Nächster Tausch", ak.due ? dstr(ak.due) : "")}
      ${zeile("Warnung ab", w ? dstr(w) : "")}
      ${zeile("Akkus", pk ? esc(pk) : `<span class="miss">Typ fehlt</span>`)}
      ${zeile("Überbrückung", c && c.tq!=null ? `${c.tq<0?"reicht nicht":zahl(c.tq,0)+" h"} ${c.ok?"✓":"✗"}` : "")}
    </dl>
    <div class="mnbtns"><button class="btn small" data-a="form" data-v="anlageEdit">Akku-Daten bearbeiten</button><button class="btn small" data-a="atab" data-v="ueb">Überbrückung berechnen</button></div>`;
  if(ak.st!=="none"){
    h += ui.confirm==="akkutausch"
      ? `<form class="atausch" data-f="akkutausch">
          <b>Akku getauscht</b>
          <div class="row"><label>Tauschdatum<input id="at-datum" type="date" max="${todayISO()}" value="${todayISO()}"></label></div>
          <div class="row"><label>Notiz (optional)<input id="at-notiz" placeholder="z. B. alte Akkus fachgerecht entsorgt"></label></div>
          <p class="hint">Neue Akkus: ${pk ? esc(pk) : "Typ unter „Akku-Daten bearbeiten“ eintragen"}</p>
          <div class="mnbtns"><button class="btn small primary">Tausch speichern</button><button type="button" class="btn small ghost" data-a="confirm" data-v="">Abbrechen</button></div>
        </form>`
      : `<button class="btn primary atbtn" data-a="confirm" data-v="akkutausch">Akku getauscht</button>`;
  }
  h += `<div class="averlauf"><b>Zuletzt getauscht</b>${verlauf.length ? verlauf.slice(0,10).map(x=> x.am
      ? `<div class="avz"><span>${dstr(new Date(x.am+"T00:00:00"))}</span><span>${x.anz||x.typ ? esc(`${x.anz?x.anz+"× ":""}${x.typ||""}`) : "Akku"}${x.von?" · "+esc(x.von):""}${x.vorher?`<small>vorher eingebaut ${dstr(new Date(x.vorher+"T00:00:00"))}</small>`:""}${x.notiz?`<small>${esc(x.notiz)}</small>`:""}</span></div>`
      : `<div class="avz"><span>–</span><span>Akku eingebaut ${dstr(new Date(x.altEinbau+"T00:00:00"))}<small>später ersetzt</small></span></div>`).join("")
    : `<p class="hint">Noch kein Tausch eingetragen.</p>`}</div>
  </section>`;
  return h;
}

function pruefTab(a, k, stAll, pctAll){
  const aid = a.id, gs = gruppen(aid);
  const nextG = gs.reduce((x,g)=>Math.max(x,g.nr),0)+1;
  const qs = a.qplan ? qStats(aid) : null;
  const qmode = !!qs && ui.pmode!=="alle";
  const pq = qmode ? (ui.pq2 || curQ()) : null;
  const inScope = m => !qmode || m.q===pq;
  const st = qmode ? (()=>{ const ms = list("melder", m=>m.anlageId===aid && inScope(m)); const ok = ms.filter(m=>mst(m)==="ok").length, mg = ms.filter(m=>mst(m)==="mangel").length; return {total:ms.length, ok, mg, offen:ms.length-ok-mg}; })() : stAll;
  const pct = st.total ? Math.round((st.ok+st.mg)/st.total*100) : 0;

  // Umschalter: alle Melder oder nur das Quartal
  let h = qs ? `<div class="pmode">
      <div class="seg pmseg" role="group" aria-label="Ansicht">
        <button data-a="pmode" data-v="quartal" aria-pressed="${qmode}">Quartal</button>
        <button data-a="pmode" data-v="alle" aria-pressed="${!qmode}">Alle Melder</button>
      </div>
      ${qmode ? `<div class="pqpick" role="group" aria-label="Quartal wählen">${[1,2,3,4].map(n=>{ const x = qs.q[n-1]; return `<button data-a="pq2" data-v="${n}" aria-pressed="${pq===n}" class="${n===qs.cq?"cur":""} ${n<qs.cq && n>=qs.sq && x.open ? "late":""}">Q${n}<small>${x.done}/${x.total}</small></button>`; }).join("")}</div>` : ""}
    </div>` : "";

  h += `<div class="prog"><div class="prog-t"><b>${st.ok+st.mg} von ${st.total}</b>&nbsp;geprüft${qmode?` in Q${pq}`:""}${st.mg?`<span class="mgc">${plural(st.mg,"Mangel","Mängel")}</span>`:""}</div>
    <div class="bar" title="${pct}% bearbeitet"><i style="width:${pct}%"></i></div></div>`;

  if(qmode){
    const vorher = qs.q.filter(x=>x.n<qs.cq && x.n>=qs.sq && x.open && x.n!==pq);
    if(vorher.length) h += `<div class="qfbar warn">${vorher.map(x=>`Q${x.n}: ${x.open} offen`).join(" · ")}<button class="btn small" data-a="pq2" data-v="${vorher[0].n}">Q${vorher[0].n} nachholen</button></div>`;
    if(st.total && !st.offen) h += `<p class="qok">Quartal ${pq} ist komplett geprüft.</p>`;
  }


  if(ui.filter==="faellig") ui.filter = "alle";
  h += `<div class="tools">
    <div class="seg" role="group" aria-label="Filter">
      ${[["alle","Alle"],["offen","Offen"],["mangel","Mängel"]].map(([key,l])=>`<button data-a="filter" data-v="${key}" aria-pressed="${ui.filter===key}">${l}</button>`).join("")}
    </div><span class="spacer"></span>
    <button class="btn small ${ui.edit?"primary":""}" data-a="edit">${ui.edit?"Fertig":"Bearbeiten"}</button>
  </div>`;

  if(!gs.length && ui.form!=="gruppe"){
    h += `<div class="empty"><h2>Noch keine Meldergruppen</h2><p>Lege die erste Gruppe an, z. B. „01 – Treppenhaus Nord“. Danach fügst du die Melder hinzu.</p></div>`;
  }
  let shown = 0;
  for(const g of gs){
    let ms = melder(g.id).filter(inScope);
    const gok = ms.filter(m=>mst(m)).length, total = ms.length;
    if(qmode && !total) continue;
    if(ui.filter==="offen") ms = ms.filter(m=>!mst(m));
    if(ui.filter==="mangel") ms = ms.filter(m=>mst(m)==="mangel");
    if(ui.filter!=="alle" && !ms.length) continue;
    shown++;
    const closed = !!ui.closed[g.id];
    h += `<section class="grp ${closed?"closed":""}">
      <button class="ghead" data-a="toggle" data-id="${g.id}" aria-expanded="${!closed}">
        <span class="gnr">${pad(g.nr)}</span><span class="gname">${esc(g.name||"Meldergruppe "+g.nr)}</span>
        <span class="gcount ${total&&gok===total?"done":""}">${gok}/${total}</span><span class="chev"></span>
      </button>
      <div class="gbar"><i style="width:${total?gok/total*100:0}%"></i></div>`;
    if(!closed){
      h += `<ul class="mel">${ms.map(m=>row(g,m)).join("")}</ul>`;
      if(ui.filter==="alle"){
        h += `<div class="gfoot">${ui.form==="melder:"+g.id ? melderForm(g) : `
          ${qmode ? "" : `<button class="btn small" data-a="form" data-v="melder:${g.id}">+ Melder</button>`}
          ${total && gok<total ? `<button class="btn small" data-a="allok" data-id="${g.id}" data-q="${qmode?pq:""}">Alle offenen${qmode?` (Q${pq})`:""} abhaken</button>`:""}
          <span class="spacer"></span>
          ${ui.edit && !qmode ? confirmBtn("delg:"+g.id,"Gruppe löschen",`Gruppe ${pad(g.nr)} mit ${total} Meldern löschen?`) : ""}`}
        </div>`;
      }
    }
    h += `</section>`;
  }
  if(qmode && !shown && gs.length) h += `<p class="hint">In Q${pq} gibt es ${ui.filter==="alle" ? "keine Melder" : "keine passenden Melder"}.</p>`;

  if(!qmode){
    if(ui.form==="gruppe"){
      const f=ui.f;
      h += `<form class="card" data-f="gruppe"><h3>Neue Meldergruppe</h3>
        <div class="row">
          <label class="narrow">Gruppe<input id="fg-nr" data-k="gnr" type="number" min="1" inputmode="numeric" required value="${esc(f.gnr ?? nextG)}"></label>
          <label>Bezeichnung<input id="fg-name" data-k="gname" placeholder="z. B. Treppenhaus Nord" value="${esc(f.gname)}"></label>
        </div>
        <div class="row"><button class="btn primary">Gruppe anlegen</button><button type="button" class="btn ghost" data-a="cancel">Abbrechen</button></div>
      </form>`;
    } else if(ui.filter==="alle"){
      h += `<div class="tools"><button class="btn primary" data-a="form" data-v="gruppe">+ Meldergruppe</button></div>`;
    }
  }
  if(stAll.total && ui.filter==="alle" && !a.qplan){
    h += `<div class="tools"><span class="spacer"></span>${confirmBtn("reset","Neue Prüfung starten","Alle Haken dieser Anlage entfernen?")}</div>`;
  }
  if(ui.edit){
  }
  return h;
}

function planTab(a){
  const aid = a.id;
  let h = quartalKarte(a);
  if(!a.qplan) return h;
  const groupOf = m => S.gruppen[m.gruppeId] || {nr:0};
  const all = list("melder", m=>m.anlageId===aid);
  const verschoben = all.filter(m=>m.qOrig && m.qOrig!==m.q).length;
  h += `<div class="tools"><span class="sec">${ui.pq ? `Quartal ${ui.pq} · ${Q_MON[ui.pq-1]}` : "Q ▾ antippen zum Verschieben oder Tauschen"}</span><span class="spacer"></span>${ui.pq ? `<button class="btn small" data-a="pq" data-v="">Alle zeigen</button>` : ""}</div>
    ${verschoben ? `<p class="hint">${plural(verschoben,"Melder","Melder")} verschoben.</p>` : ""}`;
  for(const n of (ui.pq ? [ui.pq] : [1,2,3,4])){
    const ms = all.filter(m=>m.q===n).sort((x,y)=>groupOf(x).nr-groupOf(y).nr || x.nr-y.nr);
    const done = ms.filter(m=>mst(m)).length;
    h += `<section class="grp qsec"><div class="qsech"><span class="qbig ${n===curQ()?"cur":""}">Q${n}</span><span class="gname">${Q_MON[n-1]}</span><span class="gcount ${ms.length&&done===ms.length?"done":""}">${done}/${ms.length}</span></div>
      ${ms.length ? `<ul class="mel">${ms.map(m=>planRow(groupOf(m), m)).join("")}</ul>` : `<p class="hint" style="padding:0 16px 14px">Keine Melder in diesem Quartal.</p>`}</section>`;
  }
  const ohne = all.filter(m=>!m.q);
  if(ohne.length) h += `<p class="hint">${plural(ohne.length,"Melder ist","Melder sind")} keinem Quartal zugeordnet. „Verteilung zurücksetzen“ ordnet sie ein.</p>`;
  h += `<section class="stamm"><h2>Verteilung</h2>
    ${ui.confirm==="qreset"
      ? `<div class="confirm">Alle Melder neu nach der Regel verteilen? Verschiebungen und Tausche gehen verloren, die Prüfhaken bleiben.<button class="btn small primary" data-a="qreset">Ja, neu verteilen</button><button class="btn small" data-a="confirm" data-v="">Nein</button></div>`
      : `<button class="btn small qreset" data-a="confirm" data-v="qreset">↺ Verteilung zurücksetzen &amp; neu ordnen</button>`}
    ${ui.confirm==="qweg"
      ? `<div class="confirm">Quartalsplan entfernen? Die Prüfhaken bleiben erhalten.<button class="btn small danger" data-a="qweg">Ja, entfernen</button><button class="btn small" data-a="confirm" data-v="">Nein</button></div>`
      : `<button class="btn small danger qreset" data-a="confirm" data-v="qweg">Quartalsplan entfernen</button>`}
  </section>`;
  return h;
}

function planRow(g, m){
  const st = mst(m), a = S.anlagen[m.anlageId], cq = curQ();
  const late = m.q<cq && m.q>=startQ(a) && !st;
  const moved = m.qOrig && m.qOrig!==m.q ? `<span class="qmoved">verschoben von Q${m.qOrig}</span>` : "";
  return `<li class="m pl">
    <span class="pst ${st || (late?"late":"")}" title="${st==="ok"?"geprüft":st==="mangel"?"Mangel":late?"überfällig":"offen"}"></span>
    <div class="info">
      <div class="top"><span class="mid">${pad(g.nr)}/${pad(m.nr)}</span><span class="art">${esc(artK(m.art))}</span>${st ? `<span class="stamp">${st==="mangel"?"Mangel · ":"geprüft "}${fmt(m.am)}</span>` : late ? `<span class="stamp late">nachholen</span>` : ""}</div>
      ${m.ort||moved?`<div class="ort">${esc(m.ort||"")}${m.ort&&moved?" · ":""}${moved}</div>`:""}
    </div>
    <button class="qb ${m.q===cq?"cur":""} ${late?"late":""} ${ui.qedit===m.id?"open":""}" data-a="qedit" data-id="${m.id}" aria-label="Quartal von Melder ${g.nr}/${m.nr} ändern">Q${m.q} ▾</button>
  </li>${ui.qedit===m.id ? qEditPanel(g, m) : ""}`;
}

/* ---------- Einstellungen ---------- */
function viewEinst(){
  const e = S.einst, f = ui.f, v = key => esc(f[key] ?? e[key] ?? "");
  const n = {k:list("kunden").length, a:list("anlagen").length, g:list("gruppen").length, m:list("melder").length};
  let h = backRow() + `<header class="panel"><div class="strip"><h1>Einstellungen</h1></div></header>`;

  h += `<form class="stamm" data-f="einst">
    <h2>Firma &amp; Prüfer</h2>
    <div class="row">
      <label>Firma<input id="fe-firma" data-k="firma" placeholder="Name deines Betriebs" value="${v("firma")}"></label>
      <label>Prüfer (Name oder Kürzel)<input id="fe-pruefer" data-k="pruefer" placeholder="${(()=>{ try{ return (JSON.parse(localStorage.getItem("wb.settings.v1"))||{}).name||"z. B. C. Muster"; }catch(e){ return "z. B. C. Muster"; } })()}" value="${v("pruefer")}"></label>
    </div>
    <p class="hint">Der Prüfer wird bei jedem abgehakten Melder mit Datum und Uhrzeit vermerkt. Leer lassen = Name aus den Einstellungen der Startseite.</p>
    <h2>Vorgaben</h2>
    <div class="row">
      <label>Melderart für neue Melder<select id="fe-art" data-k="art">${ARTEN.map(([key,l])=>`<option value="${key}" ${(f.art ?? e.art ?? "O")===key?"selected":""}>${key} – ${l}</option>`).join("")}</select></label>
      <label class="narrow">Kunden-Nr. ab<input id="fe-knr" data-k="knrStart" inputmode="numeric" placeholder="1001" value="${v("knrStart")}"></label>
    </div>
    <div class="row">
      <label>Akku-Wechsel alle (Jahre)<input id="fe-akj" data-k="akkuJahre" inputmode="decimal" placeholder="4" value="${v("akkuJahre")}"></label>
      <label>Warnung vorher (Monate)<input id="fe-akw" data-k="akkuWarn" inputmode="numeric" placeholder="3" value="${v("akkuWarn")}"></label>
    </div>
    <p class="hint">Gilt für alle Anlagen ohne eigenes Intervall. Maßgeblich sind die Angaben des Herstellers der Zentrale.</p>
    <h2>Schallpegel-Grenzwerte dB(A)</h2>
    <div class="row">
      <label>Mindestens<input id="fe-smin" data-k="sMin" inputmode="decimal" placeholder="65" value="${v("sMin")}"></label>
      <label>Schlafbereich<input id="fe-sschlaf" data-k="sSchlaf" inputmode="decimal" placeholder="75" value="${v("sSchlaf")}"></label>
    </div>
    <div class="row">
      <label>Über Umgebung (dB)<input id="fe-sabst" data-k="sAbstand" inputmode="decimal" placeholder="10" value="${v("sAbstand")}"></label>
      <label>Höchstens<input id="fe-smax" data-k="sMax" inputmode="decimal" placeholder="120" value="${v("sMax")}"></label>
    </div>
    <p class="hint">Voreinstellung nach DIN VDE 0833-2 / DIN EN 54-3. Abweichende Vorgaben aus dem Brandschutzkonzept hier eintragen.</p>
    <div class="row"><button class="btn primary">Speichern</button></div>
  </form>`;

  // Design wird auf dem Oh-MyGosch-Startbildschirm eingestellt

  h += `<section class="stamm">
    <h2>Daten</h2>
    <dl class="kv">
      <dt>Kunden</dt><dd>${n.k}</dd><dt>Anlagen</dt><dd>${n.a}</dd>
      <dt>Gruppen</dt><dd>${n.g}</dd><dt>Melder</dt><dd>${n.m}</dd>
      <dt>Speicher</dt><dd>${live ? "Online, auf allen deinen Geräten gleich" : "Nur auf diesem Gerät"}</dd>
    </dl>
    ${dl ? `<div class="opts">
      <button class="btn small" data-a="exportcsv">Melderliste als CSV (Excel)</button>
    </div>` : ""}

  </section>`;

  h += `<section class="stamm"><h2>Hinweis</h2>
    <p class="hint" style="max-width:60ch">Die App hilft bei der Dokumentation der Melderprüfung. Sie ersetzt nicht das Prüfprotokoll nach DIN 14675 bzw. DIN VDE 0833.</p></section>`;
  return h;
}

function confirmBtn(key,label,question){
  if(ui.confirm===key) return `<div class="confirm">${question}
    <button class="btn small danger" data-a="do" data-v="${key}">${key==="reset"?"Ja":"Ja, löschen"}</button>
    <button class="btn small" data-a="confirm" data-v="">Nein</button></div>`;
  return `<button class="btn small ${key==="reset"?"":"danger"}" data-a="confirm" data-v="${key}">${label}</button>`;
}

function row(g,m){
  const st = mst(m), a = S.anlagen[m.anlageId], cq = curQ();
  const qcls = `qb ${m.q===cq?"cur":""} ${m.q<cq&&m.q>=startQ(a)&&!st?"late":""} ${ui.qedit===m.id?"open":""}`;
  const qb = a && a.qplan && m.q ? (ui.edit ? `<span class="${qcls}">Q${m.q}</span>` : `<button class="${qcls}" data-a="qedit" data-id="${m.id}" aria-label="Quartal von Melder ${g.nr}/${m.nr} ändern">Q${m.q} ▾</button>`) : "";
  const moved = a && a.qplan && m.qOrig && m.qOrig!==m.q ? `<span class="qmoved">verschoben von Q${m.qOrig}</span>` : "";
  return `<li class="m ${st}">
    <button class="chk" data-a="ok" data-id="${m.id}" aria-label="Melder ${g.nr}/${m.nr} ${st==="ok"?"nicht ":""}als geprüft markieren" aria-pressed="${st==="ok"}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>

function loadScript(src){
  return new Promise((res, rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load "+src)); document.head.appendChild(s); });
}
let pdfjsReady = null;
function loadPdfJs(){
  if(!pdfjsReady){
    const base = "";
    // Der Worker läuft im Hauptthread (pdfjsWorker-Global), weil fremde Worker-Dateien hier nicht erlaubt sind.
    pdfjsReady = loadScript(base+"pdf.worker.js").then(()=>loadScript(base+"pdf.js")).then(()=>window.pdfjsLib)
      .catch(e=>{ pdfjsReady = null; throw e; });
  }
  return pdfjsReady;
}

const canvasBlob = (c, q=0.85) => new Promise((res, rej)=> c.toBlob(b=> b ? res(b) : rej(new Error("toBlob")), "image/jpeg", q));

async function prepImage(file){
  let bmp;
  try{ bmp = await createImageBitmap(file); }
  catch(e){
    bmp = await new Promise((res, rej)=>{ const im = new Image(); const u = URL.createObjectURL(file); im.onload=()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror=rej; im.src=u; });
  }
  const w0 = bmp.width, h0 = bmp.height, MAX = 2800;
  const okType = ["image/jpeg","image/png","image/webp","image/gif"].includes(file.type);
  if(okType && Math.max(w0,h0) <= MAX && file.size <= 8*1024*1024) return {blob:file, type:file.type, w:w0, h:h0};
  const f = Math.min(1, MAX/Math.max(w0,h0)), w = Math.round(w0*f), h = Math.round(h0*f);
  const c = document.createElement("canvas"); c.width=w; c.height=h;
  const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(bmp,0,0,w,h);
  return {blob: await canvasBlob(c, .86), type:"image/jpeg", w, h};
}

async function savePlan(kid, blob, type, name, w, h, seite){

}

function uploadError(e){
  console.error(e);
  const c = e && e.code;
  if(c==="too_large") return "Die Datei ist zu groß (max. 20 MB).";
  if(c==="quota_or_state") return "Der Speicher für Grundrisse ist voll. Lösche alte Grundrisse.";
  if(c==="unsupported_type") return "Dieses Dateiformat wird nicht unterstützt.";
  if(c==="rate_limited") return "Zu viele Uploads auf einmal. Bitte kurz warten.";
  if(e && /load https/.test(e.message||"")) return "Der PDF-Leser konnte nicht geladen werden. Öffne die App einmal mit Internet, damit sie alles speichert.";
  return "Hochladen hat nicht geklappt. Bitte nochmal versuchen.";
}

async function uploadPlans(files, kid){
  let n = 0;
  for(const file of files){
    const base = file.name.replace(/\.[^.]+$/,"") || "Grundriss";
    try{
      if(file.type==="application/pdf" || /\.pdf$/i.test(file.name)){
        setUp(`PDF wird gelesen: ${file.name}`);
        const pdfjs = await loadPdfJs();
        const doc = await pdfjs.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
        const pages = Math.min(doc.numPages, 30);
        for(let i=1;i<=pages;i++){
          setUp(`${file.name}: Seite ${i} von ${pages} …`);
          const page = await doc.getPage(i);
          const v1 = page.getViewport({scale:1});
          const vp = page.getViewport({scale: Math.min(5, 2800/Math.max(v1.width, v1.height))});
          const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
          const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
          await page.render({canvasContext:ctx, viewport:vp}).promise;
          await savePlan(kid, await canvasBlob(c, .86), "image/jpeg", pages>1 ? `${base} – S. ${i}` : base, c.width, c.height, i);
          n++; page.cleanup();
        }
        doc.destroy();
      } else if(file.type.startsWith("image/") || /\.(jpe?g|png|webp|gif|heic)$/i.test(file.name)){
        setUp(`Bild wird hochgeladen: ${file.name}`);
        const im = await prepImage(file);
        await savePlan(kid, im.blob, im.type, base, im.w, im.h, 1);
        n++;
      } else {
        toast(`„${file.name}“ ist kein Bild und kein PDF.`);
      }
    }catch(e){ toast(uploadError(e)); }
  }
  setUp(null);
  if(n) toast(n===1 ? "Grundriss gespeichert." : `${n} Grundrisse gespeichert.`);
}

/* Vollbild-Ansicht mit Zoom (Finger, Mausrad, Doppeltipp, Buttons) */
const PV = {kid:null, id:null, s:1, x:0, y:0, min:1, ptrs:new Map(), lastTap:0, moved:false, confirm:false, last:{}};
function openPlan(kid, id){
  const ps = plaeneVon(kid); if(!ps.length) return;

function closePlan(){ PV.rename = false; PV.confirm = false; const v=document.getElementById("viewer"); v.hidden = true; v.innerHTML = ""; document.body.style.overflow = ""; PV.kid = null; }
function drawPlan(){
  const v = document.getElementById("viewer");

  if(!ps.length){ closePlan(); return; }

      <button class="vbtn" data-a="vclose" aria-label="Schließen">✕</button>

    </div>
    ${ps.length>1 ? `<div class="vchips">${ps.map(q=>`<button data-a="vplan" data-id="${q.id}" aria-pressed="${q.id===p.id}">${esc(q.name)}</button>`).join("")}</div>` : ""}
    <div class="vp" id="vp"><img id="vimg" src="${blobUrl(p.asset)}" alt="${esc(p.name)}" draggable="false"><div class="vload">Grundriss wird geladen …</div></div>
    <button class="fab vback" data-a="vclose" aria-label="Zurück zur Prüfung"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Zurück</button>
    ${ui.view==="kunde" ? `<div class="vfoot">${PV.rename
      ? `<form class="vren" data-f="vren"><input id="pv-name" aria-label="Name des Grundrisses" value="${esc(p.name)}" maxlength="80"><button class="btn small primary">Speichern</button><button type="button" class="btn small" data-a="vren" data-v="">Abbrechen</button></form>`
      : PV.confirm
      ? `<span>Diesen Grundriss löschen?</span><button class="btn small danger" data-a="vdel">Ja, löschen</button><button class="btn small" data-a="vconf" data-v="">Nein</button>`
      : `<button class="btn small" data-a="vren" data-v="1">✎ Umbenennen</button>${assetsApi ? `<span class="spacer"></span><button class="btn small danger" data-a="vconf" data-v="1">Grundriss löschen</button>` : ""}`}</div>` : ""}`;
  const img = document.getElementById("vimg"), vp = document.getElementById("vp");
  const ready = () => { const l = vp.querySelector(".vload"); if(l) l.remove(); fitPlan(); };
  if(img.complete && img.naturalWidth) ready(); else { img.onload = ready; img.onerror = () => { vp.querySelector(".vload").textContent = "Grundriss konnte nicht geladen werden."; }; }
  bindViewport(vp);
}
function applyPlan(){ const img = document.getElementById("vimg"); if(img) img.style.transform = `translate(${PV.x}px,${PV.y}px) scale(${PV.s})`; }
function fitPlan(){
  const img = document.getElementById("vimg"), vp = document.getElementById("vp"); if(!img || !img.naturalWidth) return;
  const r = vp.getBoundingClientRect(), iw = img.naturalWidth, ih = img.naturalHeight;
  PV.min = Math.min(r.width/iw, r.height/ih) * 0.96; PV.s = PV.min;
  PV.x = (r.width - iw*PV.s)/2; PV.y = (r.height - ih*PV.s)/2; applyPlan();
}
function zoomAt(f, cx, cy){
  const ns = Math.max(PV.min*0.8, Math.min(PV.min*14, PV.s*f)); const k = ns/PV.s;
  PV.x = cx - (cx-PV.x)*k; PV.y = cy - (cy-PV.y)*k; PV.s = ns; applyPlan();
}
function bindViewport(vp){
  const pt = e => { const r = vp.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  let pinch = null;
  vp.addEventListener("pointerdown", e=>{
    vp.setPointerCapture(e.pointerId); PV.ptrs.set(e.pointerId, pt(e)); PV.moved = false;
    if(PV.ptrs.size===2){ const [a,b] = [...PV.ptrs.values()]; pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), m:{x:(a.x+b.x)/2, y:(a.y+b.y)/2}}; }
  });
  vp.addEventListener("pointermove", e=>{
    if(!PV.ptrs.has(e.pointerId)) return;
    const prev = PV.ptrs.get(e.pointerId), cur = pt(e); PV.ptrs.set(e.pointerId, cur);
    if(PV.ptrs.size===1){
      if(Math.abs(cur.x-prev.x)+Math.abs(cur.y-prev.y) > 1) PV.moved = true;
      PV.x += cur.x-prev.x; PV.y += cur.y-prev.y; applyPlan();
    } else if(PV.ptrs.size===2 && pinch){
      PV.moved = true;
      const [a,b] = [...PV.ptrs.values()], d = Math.hypot(a.x-b.x,a.y-b.y), m = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
      PV.x += m.x-pinch.m.x; PV.y += m.y-pinch.m.y;
      if(pinch.d > 0) zoomAt(d/pinch.d, m.x, m.y); else applyPlan();
      pinch = {d, m};
    }
  });
  const end = e=>{
    if(!PV.ptrs.has(e.pointerId)) return;
    const p = PV.ptrs.get(e.pointerId); PV.ptrs.delete(e.pointerId);
    if(PV.ptrs.size<2) pinch = null;
    if(e.type==="pointerup" && !PV.moved && PV.ptrs.size===0){
      const now = Date.now();
      if(now - PV.lastTap < 320){ PV.lastTap = 0; if(PV.s > PV.min*1.4) fitPlan(); else zoomAt(3, p.x, p.y); }
      else PV.lastTap = now;
    }
  };
  vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);
  vp.addEventListener("wheel", e=>{ e.preventDefault(); const p = pt(e); zoomAt(Math.exp(-e.deltaY*0.0018), p.x, p.y); }, {passive:false});
}
window.addEventListener("resize", ()=>{ if(PV.kid) fitPlan(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && PV.kid) closePlan(); });

/* ---------- Rechner: Überbrückungszeit der Akkus ---------- */
// Bereitschaft 72 h (bzw. 30 h / 4 h je nach Instandhaltung und Netzersatz) + Alarm 30 min,
// zuzüglich Zuschlag für Alterung. Werte anpassbar, Herstellerangaben haben Vorrang.
const AKKU_GROESSEN = [7, 12, 17, 24, 38, 45, 65, 100];
const num = v => { const x = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(x) ? x : null; };
function calcWerte(a, mitEingabe=true){
  const c = a.calc || {}, f = mitEingabe ? ui.f : {};
  const ahTyp = num(((a.akkuTyp||"").match(/(\d+[,.]?\d*)\s*Ah/i)||[])[1]);
  const pick = (k, d) => { const v = f["c_"+k] !== undefined ? f["c_"+k] : c[k]; const n = num(v); return n==null ? d : n; };
  return {
    ah: pick("ah", ahTyp), iq: pick("iq", null), ia: pick("ia", null),
    tq: pick("tq", 72), ta: pick("ta", 30), zus: pick("zus", 25),
    raw: k => f["c_"+k] !== undefined ? f["c_"+k] : (c[k] ?? "")
  };
}
function ueberbrueckung(v){
  if(v.iq==null || v.ia==null || v.iq<=0) return null;
  const z = 1 + v.zus/100, Iq = v.iq/1000, Ia = v.ia/1000, ta = v.ta/60;
  const need = z * (Iq*v.tq + Ia*ta);
  const groesse = AKKU_GROESSEN.find(g=>g>=need) || null;
  let tq = null, ok = null;
  if(v.ah){ tq = (v.ah/z - Ia*ta) / Iq; ok = tq >= v.tq; }
  return {need, groesse, tq, ok};
}
const zahl = (x, d=1) => x==null ? "–" : x.toLocaleString("de-DE", {maximumFractionDigits:d, minimumFractionDigits:0});

// Rechner 1: Überbrückungszeit mit vorhandenem Akku
function calcErgebnisHTML(v){
  const r = ueberbrueckung(v);
  if(!r) return `<p class="hint">Trag Ruhe- und Alarmstrom ein. Die Werte findest du im Menü der Zentrale oder misst sie an der Batterieleitung.</p>`;
  if(r.tq==null) return `<p class="hint">Trag die Akku-Kapazität ein.</p>`;
  return `<div class="cres ${r.ok?"ok":"bad"}"><span>Überbrückung mit ${zahl(v.ah)} Ah</span><b>${r.tq<0 ? "reicht nicht" : zahl(r.tq,0)+" h"}</b><small>${r.ok ? `✓ Soll ${zahl(v.tq,0)} h erfüllt` : `✗ Soll ${zahl(v.tq,0)} h nicht erfüllt`}</small></div>`;
}

// Rechner 2: Kapazitätsprüfung (Entladetest) – wie viel Kapazität hat der Akku noch?
function kapWerte(a){
  const f = ui.f, n = k => num(f["k_"+k]);
  const nennTyp = num(((a && a.akkuTyp)||"").match(/(\d+[,.]?\d*)\s*Ah/i)?.[1]);
  return {nenn: n("nenn") ?? nennTyp, i: n("i"), h: n("h") ?? 0, min: n("min") ?? 0, raw:k=>f["k_"+k] ?? "", nennTyp};
}
function kapErgebnisHTML(v, a){
  const t = (v.h||0) + (v.min||0)/60;
  if(v.i==null || !t) return `<p class="hint">Trag Entladestrom und Dauer bis zur Entladeschlussspannung ein.</p>`;
  const ist = v.i * t;
  let h = `<div class="cres"><span>Gemessene Kapazität</span><b>${zahl(ist,1)} Ah</b><small>${zahl(v.i,2)} A × ${zahl(t,2)} h</small></div>`;
  if(v.nenn){
    const pz = ist / v.nenn * 100, ok = pz >= 80;
    h += `<div class="cres ${ok?"ok":"bad"}"><span>Restkapazität von ${zahl(v.nenn)} Ah</span><b>${zahl(pz,0)} %</b><small>${ok ? "✓ Akku in Ordnung (≥ 80 %)" : "✗ Unter 80 % – Akku tauschen"}</small></div>`;
    const kap = Math.max(0, Math.min(100, pz));
    h += `<div class="kbar"><i class="${ok?"ok":"bad"}" style="width:${kap}%"></i><span style="left:80%"></span></div>`;
  }
  // Was bedeutet das für die Überbrückung? (Ströme aus dem oberen Rechner)
  const c = a ? calcWerte(a) : null;
  if(c && c.iq){
    const tq = (ist - (c.ia||0)/1000 * c.ta/60) / (c.iq/1000);
    h += `<p class="kform">Mit ${zahl(c.iq,0)} mA Ruhe- / ${zahl(c.ia||0,0)} mA Alarmstrom reicht die gemessene Kapazität für <b>${tq<0 ? "keine" : zahl(tq,0)+" h"}</b> Bereitschaft (Soll ${zahl(c.tq,0)} h).</p>`;
  }
  return h;
}
function kapKarte(a){
  const v = kapWerte(a);
  return `<section class="card calc kap">
    <h3>Kapazitätsprüfung</h3>
    <div class="row">
      <label>Nennkapazität (Ah)<input id="k-nenn" data-k="k_nenn" data-kcalc="1" inputmode="decimal" placeholder="${v.nennTyp ? zahl(v.nennTyp) : "z. B. 17"}" value="${esc(v.raw("nenn"))}"></label>
      <label>Entladestrom (A)<input id="k-i" data-k="k_i" data-kcalc="1" inputmode="decimal" placeholder="z. B. 0,85" value="${esc(v.raw("i"))}"></label>
    </div>
    <div class="row">
      <label>Entladedauer (Stunden)<input id="k-h" data-k="k_h" data-kcalc="1" inputmode="numeric" placeholder="0" value="${esc(v.raw("h"))}"></label>
      <label class="narrow">Minuten<input id="k-min" data-k="k_min" data-kcalc="1" inputmode="numeric" placeholder="0" value="${esc(v.raw("min"))}"></label>
    </div>
    <div id="kerg">${kapErgebnisHTML(v, a)}</div>
    <p class="hint">Gemessene Kapazität = Entladestrom × Zeit bis zur Entladeschlussspannung (z. B. 10,5 V je 12-V-Akku). Üblich gilt ein Akku unter 80 % der Nennkapazität als verbraucht. Herstellerangaben haben Vorrang.</p>
  </section>`;
}

function calcKurz(a){
  if(!a.calc) return "";
  const r = ueberbrueckung(calcWerte(a, false));
  if(!r || r.tq==null) return "";
  return ` · <span class="${r.ok?"cok":"cbad"}">Überbrückung ${r.tq<0?"reicht nicht":zahl(r.tq,0)+" h"}</span>`;
}

/* ---------- Schallpegel (Signalgeber) ---------- */
// Grenzwerte nach DIN VDE 0833-2 / DIN EN 54-3, in den Einstellungen anpassbar
function schallGrenzen(){
  const n = (v, d) => { const x = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(x) ? x : d; };
  const e = S.einst;
  return {min:n(e.sMin,65), schlaf:n(e.sSchlaf,75), abstand:n(e.sAbstand,10), max:n(e.sMax,120)};
}
const dbFmt = v => (v===null || v===undefined || v==="") ? "–" : String(Math.round(v*10)/10).replace(".", ",");
const parseDb = v => { const x = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(x) ? x : null; };
function schallBewertung(pegel, umgebung, bereich){
  const L = schallGrenzen();
  const basis = bereich==="schlaf" ? L.schlaf : L.min;
  const soll = Math.max(basis, umgebung!=null ? umgebung + L.abstand : 0);
  if(pegel==null) return {soll, st:"", txt:""};
  if(pegel > L.max) return {soll, st:"bad", txt:`zu laut (max. ${dbFmt(L.max)})`};
  if(pegel < soll) return {soll, st:"bad", txt:`zu leise (Soll ≥ ${dbFmt(soll)})`};
  return {soll, st:"ok", txt:`ok (Soll ≥ ${dbFmt(soll)})`};
}
const punkteVon = aid => list("messpunkte", p=>p.anlageId===aid).sort((a,b)=>(a.nr||0)-(b.nr||0) || (a.name||"").localeCompare(b.name||"","de"));
const messungenVon = aid => list("messungen", m=>m.anlageId===aid).sort((a,b)=>(b.am||"").localeCompare(a.am||""));
const BEREICHE = [["normal","Allgemein"],["schlaf","Schlafbereich"]];

function schallTab(a){
  const aid = a.id, L = schallGrenzen(), ps = punkteVon(aid), ms = messungenVon(aid);
  let h = `<p class="slim">Soll: ≥ ${dbFmt(L.min)} dB(A) bzw. ${dbFmt(L.abstand)} dB über Umgebung · Schlafbereich ≥ ${dbFmt(L.schlaf)} · max. ${dbFmt(L.max)} dB(A)</p>`;

  // Messpunkte
  h += `<div class="tools"><span class="sec">Messpunkte</span><span class="spacer"></span>${ui.form==="punkt" ? "" : `<button class="btn small primary" data-a="form" data-v="punkt">+ Messpunkt</button>`}</div>`;
  if(ui.form==="punkt") h += punktForm();
  if(!ps.length && ui.form!=="punkt") h += `<div class="empty"><p>Lege die Stellen an, an denen du den Alarm misst, z. B. „Flur 1. OG“ oder „Schlafraum 2“. Dann trägst du dort jeweils den gemessenen Pegel ein.</p></div>`;
  if(ps.length){
    h += `<div class="list">${ps.map(p=>{
      const last = ms.find(m=>m.punktId===p.id);
      const bw = last ? schallBewertung(last.pegel, last.umgebung, last.bereich || p.bereich) : null;
      const open = ui.form==="mess:"+p.id;
      return `<div class="spunkt">
        <div class="sp-h"><div class="it"><b>${esc(p.name)}</b><span>${p.bereich==="schlaf" ? "Schlafbereich" : "Allgemein"}${last ? ` · zuletzt ${fmtD(last.am)}` : " · noch nicht gemessen"}</span></div>
          ${last ? `<span class="sval ${bw.st}">${dbFmt(last.pegel)}<small>dB(A)</small></span>` : ""}
          ${ui.edit ? confirmBtn("delp:"+p.id,"Löschen",`Messpunkt „${esc(p.name)}“ löschen? Die Messungen im Protokoll bleiben erhalten.`)
            : open ? "" : `<button class="btn small" data-a="form" data-v="mess:${p.id}">Messen</button>`}
        </div>
        ${open ? messForm(p) : ""}
      </div>`; }).join("")}</div>`;
  }

  // Messprotokoll
  h += `<div class="tools"><span class="sec">Messprotokoll</span><span class="spacer"></span>
    ${dl && ms.length ? `<button class="btn small" data-a="sexport">CSV</button>` : ""}
    ${ms.length || ps.length ? `<button class="btn small ${ui.edit?"primary":""}" data-a="edit">${ui.edit?"Fertig":"Bearbeiten"}</button>` : ""}</div>`;
  if(!ms.length) h += `<p class="hint">Noch keine Messungen. Gespeicherte Messungen bleiben hier, bis du sie selbst löschst.</p>`;
  else {
    const tage = [...new Set(ms.map(m=>dayKey(m.am)))];
    h += `<div class="plist">`;
    for(const tag of tage){
      const rows = ms.filter(m=>dayKey(m.am)===tag);
      h += `<div class="pday">${dayLabel(tag)} · ${plural(rows.length,"Messung","Messungen")}</div>`;
      h += rows.map(m=>{ const bw = schallBewertung(m.pegel, m.umgebung, m.bereich);
        return `<div class="srow">
          <span class="ptime">${hms(new Date(m.am)).slice(0,5)}</span>
          <span class="pm"><b>${esc(m.punktName||"")}</b>${m.bereich==="schlaf" ? ` <i>Schlaf</i>` : ""}<small>${m.umgebung!=null ? `Umgebung ${dbFmt(m.umgebung)} dB(A) · ` : ""}${esc(bw.txt)}${m.von ? " · "+esc(m.von) : ""}${m.notiz ? " · "+esc(m.notiz) : ""}</small></span>
          <span class="sval ${bw.st}">${dbFmt(m.pegel)}<small>dB(A)</small></span>
          ${ui.edit ? (ui.confirm==="delm:"+m.id
            ? `<span class="sdel"><button class="btn small danger" data-a="sdel" data-v="${m.id}">Löschen</button><button class="btn small" data-a="confirm" data-v="">Nein</button></span>`
            : `<button class="del" data-a="confirm" data-v="delm:${m.id}" aria-label="Messung löschen">✕</button>`) : ""}
        </div>`; }).join("");
    }
    h += `</div>`;
  }
  return h;
}

function schallCSV(a){
  const q = v => { const s = String(v ?? ""); return /[";\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const k = hasKunde(a) ? S.kunden[a.kundeId] : {};
  const out = [["Kunde","Anlage","Datum","Uhrzeit","Messpunkt","Bereich","Alarmpegel dB(A)","Umgebung dB(A)","Soll dB(A)","Ergebnis","Prüfer","Notiz"]];
  messungenVon(a.id).slice().reverse().forEach(m=>{ const d = new Date(m.am), bw = schallBewertung(m.pegel, m.umgebung, m.bereich);
    out.push([k.name||"", a.name, dstr(d), hms(d), m.punktName, m.bereich==="schlaf"?"Schlafbereich":"Allgemein", dbFmt(m.pegel), dbFmt(m.umgebung), dbFmt(bw.soll), bw.st==="ok"?"ok":"nicht ok", m.von, m.notiz]); });
  return "﻿" + out.map(r=>r.map(q).join(";")).join("\r\n");
}

/* ---------- Prüfprotokoll / Abgleich mit dem Ereignisspeicher ---------- */
const dayKey = iso => { const d = new Date(iso); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const hms = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
const dayLabel = k => { const [y,m,d] = k.split("-"); return `${d}.${m}.${y}`; };

// Alle Prüfeinträge einer Anlage (aus dem Verlauf jedes Melders)
function protokollEintraege(aid){
  const out = [];
  for(const m of list("melder", x=>x.anlageId===aid)){
    const g = S.gruppen[m.gruppeId] || {nr:0, name:""};
    const log = Array.isArray(m.log) ? m.log : [];
    log.forEach((e, idx)=>{ if(e && e.am) out.push({m, g, e, idx}); });
    // ältere Prüfungen ohne Verlauf
    if(!Array.isArray(m.log) && !m.protGeleert && m.am && m.status) out.push({m, g, e:{am:m.am, st:m.status, von:m.von||""}, idx:-1});
  }
  return out;
}

function protokollTab(a){
  const aid = a.id, all = protokollEintraege(aid).filter(x=>!x.e.sammel);
  const off = parseInt(a.uhrOffset,10) || 0;
  const bmz = d => new Date(d.getTime() + off*1000);
  const keyOf = x => esc(`${x.m.id}|${x.idx}|${x.e.am}`);
  const offen = all.filter(x=>!x.e.abg && !x.e.nf);
  const nf = all.filter(x=>x.e.nf && !x.e.nfDone);
  const archiv = all.filter(x=>x.e.abg || x.e.nfDone);
  const neu = ui.psort!=="alt";
  offen.sort((x,y)=> neu ? y.e.am.localeCompare(x.e.am) : x.e.am.localeCompare(y.e.am));

  const zeile = (x, knoepfe) => { const d = bmz(new Date(x.e.am));
    const note = x.e.mid && S.maengel[x.e.mid] && S.maengel[x.e.mid].text;
    return `<div class="prow ${x.e.st}">
      <span class="ptime">${hms(d)}<small>${dstr(d).slice(0,6)}</small></span>
      <span class="pm"><b>${pad(x.g.nr)}/${pad(x.m.nr)}</b> <i>${esc(artK(x.m.art))}</i>${x.m.ort ? `<small>${esc(x.m.ort)}</small>` : ""}${note ? `<small class="psam">${esc(note)}</small>` : ""}${x.e.behoben ? `<small class="pfix">nach Mangelbehebung</small>` : ""}</span>
      ${knoepfe}
    </div>`; };

  let h = "";
  // Kopf
  if(!offen.length && !nf.length){
    h += `<div class="pdone">${all.length ? "✓ Alles abgeglichen" : "Noch nichts abzugleichen"}<small>${all.length ? "Neue Prüfungen erscheinen hier automatisch." : "Sobald du Melder einzeln abhakst, erscheinen sie hier mit Uhrzeit auf die Sekunde – zum Abgleich mit dem Ereignisspeicher der Zentrale."}</small></div>`;
  } else {
    h += `<div class="tools"><span class="sec"><b class="pnum">${offen.length}</b> abzugleichen${nf.length ? ` · <span class="pnfc">${nf.length} nicht gefunden</span>` : ""}</span><span class="spacer"></span>
      <div class="seg" role="group" aria-label="Reihenfolge"><button data-a="psort" data-v="neu" aria-pressed="${neu}">Neueste zuerst</button><button data-a="psort" data-v="alt" aria-pressed="${!neu}">Älteste</button></div></div>`;
  }
  // Nicht gefunden
  if(nf.length){
    h += `<div class="plist nfl"><div class="pday">Nicht im Ereignisspeicher</div>${nf.map(x=>zeile(x,
      `<span class="pact">${x.e.mid ? `<span class="pres mangel">Mangel</span>` : `<button class="btn small warnbtn" data-a="pnfmangel" data-v="${keyOf(x)}">Mangel anlegen</button>`}<button class="btn small" data-a="pmark" data-v="${keyOf(x)}" data-m="ok">✓ Doch gefunden</button><button class="btn small ghost" data-a="pmark" data-v="${keyOf(x)}" data-m="ablegen">Ablegen</button></span>`)).join("")}</div>`;
  }
  // Offen
  if(offen.length){
    h += `<div class="plist">${offen.map(x=>zeile(x,
      `<span class="pact"><button class="pbtn ok" data-a="pmark" data-v="${keyOf(x)}" data-m="ok" aria-label="Im Ereignisspeicher gefunden">✓</button><button class="pbtn nf" data-a="pmark" data-v="${keyOf(x)}" data-m="nf" aria-label="Nicht im Ereignisspeicher">✗</button></span>`)).join("")}</div>
      <p class="hint">✓ = im Ereignisspeicher gefunden, verschwindet ins Archiv · ✗ = nicht gefunden${off ? ` · Zeiten auf Uhr der Zentrale umgerechnet (${off>0?"+":""}${off} s)` : ""}</p>`;
  }
  // Archiv: pro Prüftag eine Zeile, aufklappbar
  if(archiv.length){
    const tage = [...new Set(archiv.map(x=>dayKey(x.e.am)))].sort().reverse();
    ui.parch = ui.parch || {};
    h += `<details class="parch" ${ui.parchOpen ? "open" : ""}><summary data-a="parchtoggle">Archiv · ${plural(tage.length,"Prüftag","Prüftage")}</summary>
      ${tage.map(t=>{ const rows = archiv.filter(x=>dayKey(x.e.am)===t).sort((x,y)=>x.e.am.localeCompare(y.e.am));
        const ok = rows.filter(x=>x.e.abg).length, n = rows.filter(x=>x.e.nf).length, op = !!ui.parch[t];
        return `<div class="ptag">
          <button class="ptag-h" data-a="parchday" data-v="${t}" aria-expanded="${op}"><b>${dayLabel(t)}</b><span>${ok} abgeglichen${n ? ` · <em>${n} nicht gefunden</em>` : ""}</span><span class="chev"></span></button>
          ${op ? `<div class="plist">${rows.map(x=>zeile(x, `<span class="pact"><span class="pres ${x.e.abg?"ok":"mangel"}">${x.e.abg?"gefunden":"nicht gef."}</span><button class="btn small ghost" data-a="pmark" data-v="${keyOf(x)}" data-m="undo" aria-label="Zurück in die Abgleich-Liste">↩</button></span>`)).join("")}</div>
            <div class="pdelday">${ui.confirm==="pdel:"+t
              ? `<span class="pdc">Prüftag aus dem Archiv löschen?<button class="btn small danger" data-a="pdeltag" data-v="${t}">Ja</button><button class="btn small" data-a="confirm" data-v="">Nein</button></span>`
              : `<button class="pdx" data-a="confirm" data-v="pdel:${t}">Prüftag löschen</button>`}</div>` : ""}
        </div>`; }).join("")}
    </details>`;
  }
  // Ganz unten: Protokoll komplett zurücksetzen
  const gesamt = protokollEintraege(aid).length;
  if(gesamt) h += `<div class="preset">${ui.confirm==="pclear"
    ? `<div class="confirm">Protokoll zurücksetzen? Alle ${plural(gesamt,"Eintrag","Einträge")} (offen und Archiv) werden gelöscht. Die Haken bei den Meldern bleiben.<button class="btn small danger" data-a="pclear">Ja, zurücksetzen</button><button class="btn small" data-a="confirm" data-v="">Nein</button></div>`
    : `<button class="btn small danger" data-a="confirm" data-v="pclear">↺ Protokoll zurücksetzen</button>`}</div>`;
  return h;
}

async function protokollMarkieren(key, art){
  const [mid, idxS, am] = key.split("|"), m = S.melder[mid]; if(!m) return;
  let log = Array.isArray(m.log) ? m.log.map(e=>({...e})) : [];
  let i = +idxS;
  if(i < 0 || !log[i] || log[i].am !== am){
    i = log.findIndex(e=>e.am===am);
    if(i < 0){ log.push({am, st:m.status, von:m.von||""}); i = log.length-1; }
  }
  const e = log[i];
  if(art==="ok"){ e.abg = true; delete e.nf; delete e.nfDone; }
  else if(art==="nf"){ e.nf = true; delete e.abg; }
  else if(art==="ablegen"){ e.nfDone = true; }
  else if(art==="undo"){ delete e.abg; delete e.nf; delete e.nfDone; }
  else if(art && art.mid){ e.mid = art.mid; e.nfDone = true; }
  await upd("melder", mid, {log});
}
async function protokollNfMangel(key){
  const [mid, , am] = key.split("|"), m = S.melder[mid]; if(!m) return;
  const g = S.gruppen[m.gruppeId] || {}, d = new Date(am);
  const id = await add("maengel", {anlageId:m.anlageId, melderId:mid, gruppeNr:g.nr||0, melderNr:m.nr, art:m.art||"", ort:m.ort||"",
    text:`Auslösung nicht im Ereignisspeicher gefunden (Prüfung ${dstr(d)} ${hms(d)})`, am:new Date().toISOString(), von:pruefName(), status:"offen"});
  if(id) await protokollMarkieren(key, {mid:id});
}

function protokollCSV(a){
  const off = parseInt(a.uhrOffset,10) || 0;
  const rows = protokollEintraege(a.id).filter(x=>dayKey(x.e.am)===ui.ptag).sort((x,y)=>x.e.am.localeCompare(y.e.am));
  const q = v => { const s = String(v ?? ""); return /[";\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const k = hasKunde(a) ? S.kunden[a.kundeId] : {};
  const out = [["Kunde","Anlage","Datum","Uhrzeit (Handy)","Uhrzeit (Zentrale)","Gruppe","Melder","Adresse","Art","Einbauort","Ergebnis","Prüfer","Sammel-Abhakung","Abgeglichen"]];
  rows.forEach(x=>{ const d = new Date(x.e.am), z = new Date(d.getTime()+off*1000);
    out.push([k.name||"", a.name, dstr(d), hms(d), hms(z), pad(x.g.nr), pad(x.m.nr), `${pad(x.g.nr)}/${pad(x.m.nr)}`, artK(x.m.art), x.m.ort, x.e.st==="mangel"?"Mangel":"ok", x.e.von, x.e.sammel?"ja":"", x.e.abg?"ja":""]); });
  return "﻿" + out.map(r=>r.map(q).join(";")).join("\r\n");
}

/* ---------- Export / Import ---------- */
const stampName = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
async function offer(filename, data){
  try{ await dl.save({filename, data}); }
  catch(e){ if(e && e.code!=="declined") toast("Die Datei konnte nicht gespeichert werden."); }
}
function csv(){
  const q = v => { const s = String(v ?? ""); return /[";\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const rows = [["Kunden-Nr.","Kunde","Anlage","Standort","Gruppe","Gruppenname","Melder","Art","Einbauort","Quartal","Status","Geprüft am","Prüfer"]];
  const kn = a => hasKunde(a) ? S.kunden[a.kundeId] : {};
  const as = list("anlagen").sort((x,y)=>(kn(x).name||"").localeCompare(kn(y).name||"","de") || x.name.localeCompare(y.name,"de"));
  for(const a of as) for(const g of gruppen(a.id)) for(const m of melder(g.id)){
    const k = kn(a);
    rows.push([k.nr, k.name, a.name, a.ort, pad(g.nr), g.name, `${pad(g.nr)}/${pad(m.nr)}`, artK(m.art), m.ort,
      m.q ? "Q"+m.q : "", mst(m)==="ok" ? "geprüft" : mst(m)==="mangel" ? "Mangel" : "offen", m.am ? fmtD(m.am)+" "+fmt(m.am).split(" ")[1] : "", m.von]);
  }
  return "﻿" + rows.map(r=>r.map(q).join(";")).join("\r\n");
}
async function importBackup(file){
  let data;
  try{ data = JSON.parse(await file.text()); }catch(e){ toast("Die Datei ist keine gültige Sicherung."); return; }
  if(!data || data.app!=="bma-pruefung"){ toast("Die Datei ist keine Sicherung dieser App."); return; }
  let n = 0;
  for(const c of COLS) for(const [id, doc] of Object.entries(data[c]||{})){ if(await put(c, id, doc)) n++; }
  if(data.einstellungen && Object.keys(data.einstellungen).length){
    if(live){ try{ await db.doc("einstellungen/app").set(data.einstellungen); }catch(e){} } else S.einst = data.einstellungen;
  }
  if(data.blobs){ await GT.restoreBlobs(data.blobs); await initBlobs(); }
  if(!live) saveLocal();
  render(); toast(`${n} Einträge eingespielt.`);
}

function focusFirst(){ const i=document.querySelector("form.card input:not(#fk-nr)"); if(i) i.focus(); }

async function act(a, d){
  if(a==="back") return zurueck();
  const vorher = navSnap();
  navInAct = true;
  try{ return await act0(a, d); }
  finally{ navInAct = false; if(navKey(vorher)!==navKey(navSnap())){ navHist.push(vorher); if(navHist.length>60) navHist.shift(); } }
}
async function act0(a, d){
  switch(a){
    case "tab": ui.q = ""; ui.qa = ""; return go(d.v);
    case "go": return go(d.v, d.id);
    case "ksel": { ui.kunde = d.id; saveNav(); render(); const k = S.kunden[d.id]; if(k) toast(`${k.name} ausgewählt`); return; }
    case "ptag": ui.ptag = d.v; return render();
    case "pclear": { ui.confirm = null; let n = 0;
      for(const m of list("melder", x=>x.anlageId===ui.anlage)){
        if((Array.isArray(m.log) && m.log.length) || !m.protGeleert){ await upd("melder", m.id, {log:[], protGeleert:true}); n++; }
      }
      render(); toast("Protokoll gelöscht."); return; }
    case "mnedit": ui.mnote = d.id; ui.f.mtext = undefined; render(); setTimeout(()=>{ const t = document.getElementById("mn-text"); if(t) t.focus(); }, 30); return;
    case "mnclose": ui.mnote = null; return render();
    case "mnsave": { const t = (document.getElementById("mn-text")||{}).value || ""; ui.mnote = null; ui.f.mtext = undefined;
      if(S.maengel[d.id]) await upd("maengel", d.id, {text: t.trim()}); render(); toast("Mangel-Notiz gespeichert."); return; }
    case "mfilter": ui.mfilter = d.v; ui.medit = null; ui.merl = null; return render();
    case "medit": ui.medit = d.id || null; ui.merl = null; ui.f = {}; return render();
    case "mesave": { const t = (document.getElementById("me-text")||{}).value || ""; ui.medit = null; ui.f = {};
      await upd("maengel", d.id, {text: t.trim()}); render(); return; }
    case "merl": ui.merl = d.id || null; ui.medit = null; ui.f = {}; return render();
    case "merlsave": { const x = S.maengel[d.id]; if(!x) return;
      const t = ((document.getElementById("mf-text")||{}).value || "").trim(), mitOk = !!(document.getElementById("mf-ok")||{}).checked;
      const now = new Date().toISOString(), von = pruefName();
      ui.merl = null; ui.f = {};
      await upd("maengel", d.id, {status:"erledigt", erledigtAm:now, erledigtVon:von, erledigtText:t});
      const m = S.melder[x.melderId];
      if(mitOk && m) await upd("melder", x.melderId, {status:"ok", am:now, von, log:[...(m.log||[]), {am:now, st:"ok", von, behoben:d.id}]});
      render(); toast(mitOk && m ? "Mangel erledigt, Melder abgehakt." : "Mangel erledigt."); return; }
    case "mreopen": await upd("maengel", d.id, {status:"offen"}); return render();
    case "mdel": ui.confirm = null; await del("maengel", d.id); render(); toast("Mangel gelöscht."); return;
    case "sexport": { const a = S.anlagen[ui.anlage]; if(!a) return; return offer(`Schallpegel_${a.name.replace(/[^\wäöüÄÖÜß-]+/g,"_")}_${todayISO()}.csv`, schallCSV({id:ui.anlage, ...a})); }
    case "sdel": ui.confirm = null; await del("messungen", d.v); render(); toast("Messung gelöscht."); return;
    case "pdeltag": { ui.confirm = null; const tag = d.v;
      for(const m of list("melder", x=>x.anlageId===ui.anlage)){
        const log = Array.isArray(m.log) ? m.log : [];
        const rest = log.filter(e=>!e.am || dayKey(e.am)!==tag || !(e.abg || e.nfDone));
        if(rest.length!==log.length || !Array.isArray(m.log)) await upd("melder", m.id, {log:rest, protGeleert:true});
      }
      render(); toast(`Protokoll vom ${dayLabel(tag)} gelöscht.`); return; }
    case "psort": ui.psort = d.v; return render();
    case "pmark": await protokollMarkieren(d.v, d.m); render();
      if(d.m==="ok") toast("Abgeglichen – ins Archiv verschoben."); else if(d.m==="nf") toast("Als „nicht gefunden“ markiert."); return;
    case "pnfmangel": await protokollNfMangel(d.v); render(); toast("Mangel angelegt."); return;
    case "parchtoggle": ui.parchOpen = !ui.parchOpen; return render();
    case "parchday": ui.parch = ui.parch || {}; ui.parch[d.v] = !ui.parch[d.v]; ui.parchOpen = true; return render();
    case "pexport": { const a = S.anlagen[ui.anlage]; if(!a) return; return offer(`Protokoll_${a.name.replace(/[^\wäöüÄÖÜß-]+/g,"_")}_${ui.ptag}.csv`, protokollCSV({id:ui.anlage, ...a})); }
    case "ctq": ui.f.c_tq = d.v; return render();
    case "gomaengel": go("anlage", d.id); ui.atab = "maengel"; ui.mfilter = "offen"; return render();
    case "alertopen": ui.alertOpen = ui.alertOpen===d.v ? null : d.v; return render();
    case "akkupanel": ui.akkuPanel = true; ui.confirm = null; ui.form = null; render(); window.scrollTo(0,0); return;
    case "goakku": go("anlage", d.id); ui.akkuPanel = true; return render();
    case "akkuopen": ui.akkuOpen = !ui.akkuOpen; return render();
    case "qplan": ui.atab = "plan"; return planErstellen(ui.anlage);
    case "atab": if(ui.atab!==d.v) ui.f = {}; ui.atab = d.v; ui.akkuPanel = false; ui.qedit = null; ui.confirm = null; ui.edit = false; ui.form = null; render(); window.scrollTo(0,0); return;
    case "pq": { const v = d.v ? +d.v : null; ui.pq = ui.pq===v ? null : v; ui.qedit = null; return render(); }
    case "pmode": ui.pmode = d.v; ui.form = null; return render();
    case "pq2": ui.pmode = "quartal"; ui.pq2 = +d.v; ui.form = null; render(); return;
    case "zupruef": ui.atab = "pruefung"; ui.pmode = "quartal"; ui.pq2 = null; ui.filter = "offen"; ui.qedit = null; render(); window.scrollTo(0,0); return;
    case "qreset": ui.confirm = null; ui.qedit = null; await planErstellen(ui.anlage); return;
    case "qedit": ui.qedit = (d.id && ui.qedit!==d.id) ? d.id : null; return render();
    case "qset": { const m = S.melder[d.id]; await qVerschieben(d.id, +d.v); ui.qedit = null; render(); if(m) toast(`Melder ${pad((S.gruppen[m.gruppeId]||{}).nr||0)}/${pad(m.nr)} → Q${d.v}`); return; }
    case "qweg": ui.confirm = null; return planEntfernen(ui.anlage);
    case "qf": { const v = d.v==="" ? null : d.v==="jetzt" ? "jetzt" : +d.v; ui.qf = (ui.qf===v) ? null : v; render(); return; }
    case "akkuneu": { const a = S.anlagen[ui.anlage]; if(!a) return; ui.confirm = null;
      await upd("anlagen", ui.anlage, {akkuDatum: todayISO(), akkuHist: [...(a.akkuHist||[]), a.akkuDatum].filter(Boolean)});
      render(); toast("Akkutausch eingetragen."); return; }
    case "addplan": document.getElementById("planFile").click(); return;
    case "plan": return openPlan(ui.kunde, d.id);
    case "openplan": return openPlan(d.id);
    case "vclose": return closePlan();
    case "vplan": PV.id = d.id; PV.confirm = false; return drawPlan();
    case "vzoom": { const vp = document.getElementById("vp"); if(!vp) return; const r = vp.getBoundingClientRect();
      if(d.v==="0") return fitPlan(); return zoomAt(d.v==="1" ? 1.6 : 1/1.6, r.width/2, r.height/2); }
    case "vconf": PV.confirm = !!d.v; PV.rename = false; return drawPlan();
    case "vren": PV.rename = !!d.v; PV.confirm = false; drawPlan(); if(PV.rename){ const i = document.getElementById("pv-name"); if(i){ i.focus(); i.select(); } } return;
    case "vdel": { const id = PV.id; PV.confirm = false; await deletePlan(id); delete S.plaene[id]; drawPlan(); render(); toast("Grundriss gelöscht."); return; }
    case "ok": return setStatus(d.id,"ok");
    case "mangel": return setStatus(d.id,"mangel");
    case "toggle": ui.closed[d.id] = !ui.closed[d.id]; return render();
    case "filter": ui.filter = d.v; return render();
    case "afilter": ui.afilter = d.v; return render();
    case "edit": ui.edit = !ui.edit; ui.confirm=null; if(!ui.edit && ui.form==="anlageEdit") ui.form=null; return render();
    case "form": ui.form = d.v; ui.f = {}; if(d.v==="anlageEdit") window.scrollTo(0,0); render(); focusFirst(); return;
    case "kedit": ui.form = "kundeEdit"; ui.f = {}; render(); focusFirst(); return;
    case "cancel": ui.form = null; ui.f = {}; return render();
    case "confirm": ui.confirm = d.v || null; return render();
    case "design": design = d.v; try{ localStorage.setItem("app.design", design); }catch(e){} applyDesign(); return render();
    case "theme": theme = d.v; try{ localStorage.setItem("app.mode", theme); }catch(e){} applyTheme(); return render();
    case "exportcsv": return offer(`Melderliste_${stampName()}.csv`, csv());
    case "exportjson": {
      const out = {app:"bma-pruefung", version:1, exportiert:new Date().toISOString(), einstellungen:S.einst};
      for(const c of COLS) out[c] = S[c];
      out.blobs = await GT.blobsAsData(Object.values(S.plaene).map(p=>p.asset));
      return offer(`BMA-Sicherung_${stampName()}.json`, JSON.stringify(out));
    }
    case "pickimport": ui.confirm = null; render(); document.getElementById("importFile").click(); return;
    case "delm": return del("melder", d.id);
    case "allok": {
      const now = new Date().toISOString(), von = pruefName();
      for(const m of melder(d.id).filter(m=>!mst(m) && (!d.q || m.q===+d.q))) await upd("melder", m.id, {status:"ok", am:now, von, log:[...(m.log||[]), {am:now, st:"ok", von, sammel:true}]});
      return;
    }
    case "do": {
      const key = d.v; ui.confirm = null; render();
      if(key==="reset"){
        for(const m of list("melder",m=>m.anlageId===ui.anlage && m.status)) await upd("melder", m.id, {status:"", am:null, von:""});
        toast("Neue Prüfung gestartet – alle Melder sind wieder offen.");
      } else if(key.startsWith("delp:")){
        await del("messpunkte", key.slice(5)); toast("Messpunkt gelöscht. Die Messungen bleiben im Protokoll.");
      } else if(key.startsWith("delg:")){
        const gid = key.slice(5);
        for(const m of melder(gid)) await del("melder", m.id);
        await del("gruppen", gid);
      } else if(key==="dela"){
        const aid = ui.anlage;
        go("anlagen");
        await deleteAnlage(aid);
        toast("Anlage gelöscht.");
      } else if(key.startsWith("delk:")){
        const kid = key.slice(5), name = (S.kunden[kid]||{}).name;
        go("kunden");
        for(const an of anlagenVon(kid)) await deleteAnlage(an.id);
        for(const pl of plaeneVon(kid)) await deletePlan(pl.id);
        await del("kunden", kid);
        if(ui.kunde===kid){ ui.kunde = null; saveNav(); render(); }
        toast(`Kunde „${name}“ gelöscht.`);
      }
      return;
    }
  }
}
